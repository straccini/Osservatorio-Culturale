.score-badge.med  { background: oklch(0.96 0.03 70); color: var(--accent); }

/* ============================================================
   BR-ROW — Radar Bandi: scheda in griglia 2 colonne
   Pattern esteso da home-list-row
   ============================================================ */
/* v4.27.5 — Bandi row: spacing variabile, respiro verticale */
.br-row {
  display: grid;
  grid-template-columns: 1fr 160px;
  gap: 8px 24px;
  align-items: start;
  padding: 14px 0 12px;
  border-bottom: 1px solid var(--rule);
  transition: background .15s;
}
.br-row:hover { background: var(--surface-2); margin: 0 -14px; padding-left: 14px; padding-right: 14px; border-radius: var(--r-sm, 6px); }
/* v4.27.3 — Urgenti: tint sfondo + bordo sottile (no side-stripe) */
.br-row.br-urgent { background: oklch(0.97 0.015 25); border-bottom-color: oklch(0.88 0.04 25); }
.br-row.br-urgent:hover { background: oklch(0.95 0.02 25); }

/* ── SINISTRA ── */
.br-left { min-width: 0; }

/* Tag: tematica + urgenza */
.br-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 5px; }

/* Box tematica colorato */
.br-tema {
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 20px;
  background: var(--surface-2); color: var(--ink-3);
  white-space: nowrap;
}
.br-a1 { background: var(--amb-1-soft); color: var(--amb-1); }
.br-a2 { background: var(--amb-2-soft); color: var(--amb-2); }
.br-a3 { background: var(--amb-3-soft); color: var(--amb-3); }
.br-a4 { background: var(--amb-4-soft); color: var(--accent); }
.br-a5 { background: var(--amb-5-soft); color: var(--amb-5); }

/* v4.22 WCAG — Contrasto migliorato per testo piccolo su amb-2 */
.br-tema.br-a2, .sr-badge.a2, .hamb-chip.a2 .hamb-name { color: oklch(0.42 0.10 165); }

/* Badge urgenza / nuovo */
.br-badge-urgent {
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700;
  color: var(--danger); background: oklch(0.96 0.02 25); padding: 3px 9px; border-radius: 20px;
}
.br-badge-new {
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700;
  color: var(--success); background: oklch(0.96 0.03 165); padding: 3px 9px; border-radius: 20px;
}
/* v4.25 — Badge tipo bando */
.br-tipo-badge {
  font-family: var(--font-ui); font-size: 0.7rem; font-weight: 600;
  padding: 2px 8px; border-radius: 20px; white-space: nowrap;
}
.br-tipo-finanziamento { color: oklch(0.46 0.12 55); background: oklch(0.96 0.03 80); }
.br-tipo-servizio_fornitura { color: oklch(0.42 0.14 260); background: oklch(0.95 0.03 260); }
.br-tipo-servizio { color: oklch(0.42 0.14 260); background: oklch(0.95 0.03 260); }
.br-tipo-fornitura { color: oklch(0.42 0.16 300); background: oklch(0.95 0.03 300); }
.br-tipo-lavori { color: oklch(0.40 0.10 165); background: oklch(0.95 0.03 165); }

/* v4.27.29 — Titolo bando/norme: font-ui per coerenza con tutto il design system */
.br-title {
  font-family: var(--font-ui); font-size: 1rem; font-weight: 600;
  color: var(--ink); line-height: 1.35; margin: 0 0 4px 0;
  cursor: pointer; letter-spacing: -0.01em;
}
.br-title:hover { color: var(--link); }

/* Sommario */
.br-summary {
  font-family: var(--font-ui); font-size: 0.875rem; color: var(--ink-3); line-height: 1.45;
  margin: 0 0 6px 0;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* Meta info: ente · regione · importo · rilevato */
.br-meta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
  font-family: var(--font-ui); font-size: 0.8125rem; color: var(--ink-3);
  margin-top: 2px;
}
.br-ente { font-weight: 600; color: var(--ink-2); }
.br-sep { color: var(--rule-2); }
.br-importo-inline { color: var(--success,#0F7B5A); font-weight: 600; }
.br-rilev { font-style: italic; color: var(--ink-4, var(--ink-3)); }

/* ── DESTRA ── */
.br-right {
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  text-align: right;
}

/* v4.27.17 — Scadenza: font-ui coerente con meta e body */
.br-scad {
  font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 600;
  color: var(--ink-2); white-space: nowrap; line-height: 1.2;
}
.br-scad-urgent { color: var(--danger); }
.br-scad-med    { color: var(--warning); }
.br-scad-nd     { color: var(--ink-4, var(--ink-3)); font-weight: 400; font-size: 0.875rem; }

/* Badge giorni */
.br-giorni {
  display: inline-block; font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 700;
  padding: 2px 8px; border-radius: 20px; margin-top: 3px;
  background: var(--surface-2); color: var(--ink-3);
}
.br-gd-urgent { background: oklch(0.94 0.03 25); color: var(--danger); }
.br-gd-med    { background: oklch(0.96 0.03 80); color: var(--warning); }
.br-gd-ok     { background: var(--surface-2); color: var(--ink-3); }

/* Link scheda — CTA primario */
.br-link {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 700;
  padding: 8px 14px; border-radius: 7px; width: 100%; box-sizing: border-box;
  border: 2px solid var(--link); color: var(--link);
  background: transparent; text-decoration: none;
  transition: all .15s; white-space: nowrap; cursor: pointer; line-height: 1;
}
.br-link:hover { background: var(--link); color: var(--paper); }
.br-link-nd {
  border-color: var(--rule); color: var(--ink-4, var(--ink-3));
  cursor: default; font-weight: 400;
}
.br-link-nd:hover { background: transparent; color: var(--ink-4, var(--ink-3)); }
/* Link non-diretto (consulta sito / ricerca): stessa forma, tono più sobrio */
.br-link-alt { border-color: var(--ink-3, #6E6E73); color: var(--ink-2, #3A3A3C); font-weight: 600; }
.br-link-alt:hover { background: var(--ink-3, #6E6E73); color: var(--paper); }

/* ============================================================
   Bottoni azione — direzione C v5.0
   - Allineati al margine destro (anche su mobile)
   - Stato di default neutro chiaro, colore semantico al hover
   - Pill 999px, padding uniforme, font weight 500
   - Etichette sempre visibili (icona + label)
   ============================================================ */
.br-acts {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
  margin-left: auto;
  width: 100%;
}
.br-act {
  font-family: var(--font-ui);
  font-size: 0.8125rem;
  font-weight: 500;
  letter-spacing: -0.005em;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--rule,#E5E5E7);
  background: var(--paper);
  color: var(--ink-2,#3A3A3C);
  cursor: pointer;
  white-space: nowrap;
  line-height: 1.1;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 30px;
}
.br-act:hover {
  border-color: var(--ink,#101010);
  background: var(--surface,#F7F7F8);
  color: var(--ink,#101010);
}
.br-act:active { transform: translateY(1px); }
.br-act:focus-visible {
  outline: 2px solid var(--accent,#935851); /* WCAG 2.4.7: focus visibile (era ring accent-soft ~1.1:1) */
  outline-offset: 1px;
  border-color: var(--ink,#101010);
}

/* v5.2 — Pulsanti azione SOTTO la scheda, a tutta larghezza (riga dedicata) */
.br-acts {
  grid-column: 1 / -1;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--rule);
}
.br-act { font-size: 0.75rem; padding: 5px 11px; min-height: 30px; gap: 4px; }

/* v5.2 — Scala cromatica bianco → rosso sinopia per intensità d'azione */
/* v4.27.3 — Scala cromatica sinopia OKLCH per intensita d'azione */
.br-act-read  { background:oklch(0.97 0.01 22); border-color:oklch(0.90 0.03 22); color:oklch(0.42 0.05 22); }
.br-act-save  { background:oklch(0.93 0.03 22); border-color:oklch(0.85 0.04 22); color:var(--accent); }
.br-act-arch  { background:oklch(0.82 0.05 22); border-color:oklch(0.72 0.06 22); color:oklch(0.35 0.06 22); }
.br-act-trash { background:var(--accent); border-color:var(--accent); color:var(--paper); }

.br-act-read:hover  { border-color:oklch(0.78 0.04 22); color:oklch(0.38 0.06 22); background:oklch(0.94 0.02 22); }
.br-act-save:hover  { border-color:var(--accent); color:var(--accent-hover); background:oklch(0.90 0.04 22); }
.br-act-arch:hover  { border-color:oklch(0.62 0.06 22); color:oklch(0.30 0.06 22); background:oklch(0.78 0.06 22); }
.br-act-trash:hover { border-color:var(--accent-hover); color:var(--paper); background:var(--accent-hover); }

/* Stato salvato — attivo persistente */
.br-act-save-on {
  border-color: var(--accent,#935851);
  color: var(--accent,#935851);
  background: var(--accent-soft,#F0E6E4);
  font-weight: 600;
}
.br-act-save-on:hover {
  border-color: var(--accent-hover,#7A4940);
  color: var(--accent-hover,#7A4940);
  background: oklch(0.93 0.04 55);
}

/* Stato letto — feedback dopo click su "Letto/Ascoltato/Visto" */
.br-act-read.is-done {
  border-color: var(--success,#0F7B5A);
  color: var(--success,#0F7B5A);
  background: var(--amb-2-soft,#D1FAE5);
  font-weight: 600;
}

/* Dark mode — bottoni azione */
[data-theme="dark"] .br-act {
  background: var(--surface,#141414);
  border-color: var(--rule,#27272A);
  color: var(--ink-2,#E4E4E7);
}
[data-theme="dark"] .br-act:hover {
  border-color: var(--ink,#FAFAFA);
  background: var(--surface-2,#1F1F1F);
  color: var(--ink,#FAFAFA);
}
/* v4.27.3 — Dark mode azioni OKLCH */
[data-theme="dark"] .br-act-read:hover  { border-color: oklch(0.75 0.12 165); color: oklch(0.75 0.12 165); background: oklch(0.52 0.10 165 / 0.18); }
[data-theme="dark"] .br-act-arch:hover  { border-color: oklch(0.80 0.14 85); color: oklch(0.80 0.14 85); background: oklch(0.52 0.14 70 / 0.22); }
[data-theme="dark"] .br-act-trash:hover { border-color: oklch(0.78 0.08 22); color: oklch(0.78 0.08 22); background: oklch(0.50 0.16 30 / 0.22); }
[data-theme="dark"] .br-act-save:hover  { border-color: oklch(0.68 0.16 35); color: oklch(0.68 0.16 35); background: oklch(0.55 0.14 30 / 0.18); }
[data-theme="dark"] .br-act-save-on {
  border-color: oklch(0.68 0.16 35); color: oklch(0.68 0.16 35); background: oklch(0.55 0.14 30 / 0.22);
}
[data-theme="dark"] .br-act-read.is-done {
  border-color: oklch(0.75 0.12 165); color: oklch(0.75 0.12 165); background: oklch(0.52 0.10 165 / 0.18);
}

/* v5.2 — Pulsanti compatti (riga dedicata sotto la scheda); touch target ~32px */
.br-act-read, .br-act-arch, .br-act-trash, .br-act-save, .br-act-save-on {
  min-width: 44px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* v4.27.3 — Scala sinopia dark mode OKLCH */
[data-theme="dark"] .br-act-read  { background:oklch(0.52 0.08 22 / 0.12); border-color:oklch(0.52 0.08 22 / 0.35); color:oklch(0.88 0.03 22); }
[data-theme="dark"] .br-act-save  { background:oklch(0.52 0.08 22 / 0.24); border-color:oklch(0.52 0.08 22 / 0.50); color:oklch(0.92 0.03 22); }
[data-theme="dark"] .br-act-arch  { background:oklch(0.52 0.08 22 / 0.42); border-color:oklch(0.52 0.08 22 / 0.70); color:oklch(0.96 0.02 22); }
[data-theme="dark"] .br-act-trash { background:var(--accent); border-color:var(--accent); color:var(--paper); }

/* v4.22 WCAG — Touch target minimo 44px per bottoni topbar */
.topbar-user-btn, .topbar-search-btn, .topbar-darkmode-btn {
  min-width: 44px;
  min-height: 44px;
}

/* === FILTRI DUE LIVELLI === */
.filters-primary  { margin-bottom: 2px; }
.filters-secondary { padding-top: 8px; border-top: 1px solid var(--rule); margin-bottom: 20px; }
.filters-label {
  font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 700;
  color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em;
  white-space: nowrap; align-self: center; margin-right: 2px;
}

/* === ITEM READ STATE === */
/* .item-letto: vedi sezione DELIGHT v5.1 per stili raffinati */

/* === PAGE ARCHIVIO / CESTINO === */
#page-archivio .bando-row,
#page-cestino  .bando-row { padding-left: 14px; }

/* ==========================================================
   TOAST NOTIFICATION SYSTEM
   ========================================================== */
#oc-toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.oc-toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border-radius: 10px;
  font-family: var(--font-ui);
  font-size: 0.9375rem;
  font-weight: 500;
  color: var(--paper);
  background: var(--ink);
  box-shadow: 0 4px 20px rgba(0,0,0,.22);
  pointer-events: auto;
  max-width: 340px;
  line-height: 1.35;
  animation: toast-in .22s ease;
  transition: opacity .3s, transform .3s;
}
.oc-toast.out { opacity: 0; transform: translateY(8px); }
.oc-toast.ok   { background: var(--success,#0F7B5A); }
.oc-toast.warn { background: var(--warning); }
.oc-toast.err  { background: var(--danger,#C2410C); }
.oc-toast svg  { flex-shrink: 0; opacity: .9; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ==========================================================
   DELIGHT — micro-interazioni raffinate (v5.0.5)
   ========================================================== */

/* Nav item: sottile lift al hover */
.nav-item:hover svg {
  transform:translateY(-1px);
  transition:transform .2s cubic-bezier(.16,1,.3,1);
}

/* Bottone primario: press tattile */
.btn.btn-primary:active,
button[style*="background:#8B4513"]:active {
  transform:translateY(1px);
  transition:transform .08s;
}

/* Stella salvataggio: pulse al click */
@keyframes star-pulse {
  0% { transform:scale(1); }
  50% { transform:scale(1.3); }
  100% { transform:scale(1); }
}
.br-act-save-on {
  animation:star-pulse .3s cubic-bezier(.16,1,.3,1);
}

/* Card hover: sottile elevazione */
.br-row:hover {
  transform:translateY(-1px);
  transition:transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s cubic-bezier(.16,1,.3,1);
}

/* Toast: icona check animata per .ok */
.oc-toast.ok::before {
  content:'';
  width:18px; height:18px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  flex-shrink:0;
  animation:toast-check .3s ease-out;
}
@keyframes toast-check {
  from { transform:scale(0); opacity:0; }
  to { transform:scale(1); opacity:1; }
}

/* Filter chip: transizione fluida */
.filter-chip {
  transition:background .15s, color .15s, border-color .15s, transform .15s;
}
.filter-chip:active {
  transform:scale(0.97);
}

/* ============================================================
   v4.27.11 — FOCUS STATES UNIFICATI (WCAG 2.4.7 / 1.4.11)
   Ring: 2px solid accent, offset 2px, glow accent-soft.
   Coerente su tutti gli interattivi, light e dark mode.
   ============================================================ */

/* Inputs */
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:2px;
  transition:outline-offset .15s;
}

/* Navigation sidebar */
.nav-item:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:-2px;
  border-radius:var(--r-sm);
}

/* Filter chips */
.filter-chip:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* Topbar icons + theme toggle */
.topbar-icon:focus-visible,
.theme-toggle:focus-visible,
.topbar-hamburger:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* Card bandi row (keyboard navigable) */
.br-row:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:-2px;
  border-radius:var(--r-sm);
}

/* Links */
.br-link:focus-visible,
.section-action:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* Home chips */
.home-chip:focus-visible,
.hero-chip:focus-visible,
.hamb-chip:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* Accordion toggle */
.nav-accordion-toggle:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:-2px;
}

/* User chip topbar */
.topbar-user:focus-visible,
.user-chip:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* Generic: any button/a without specific rule */
button:focus-visible:not(.btn):not(.br-act):not(.nav-item):not(.filter-chip):not(.theme-toggle):not(.topbar-icon):not(.topbar-hamburger):not(.home-chip):not(.hero-chip):not(.nav-accordion-toggle) {
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* Scroll indicator sottile nella topbar */
.topbar::after {
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  height:2px;
  background:var(--accent,#8B4513);
  opacity:.15;
  width:0;
  transition:width .1s;
}

/* KPI card hover nel workspace/stats */
.st-kpi-card {
  transition:transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s cubic-bezier(.16,1,.3,1);
}
.st-kpi-card:hover {
  transform:translateY(-2px);
  box-shadow:var(--shadow-2);
}

/* Ambito dot pulse sottile al hover nella sidebar */
.nav-item.amb:hover .amb-dot {
  box-shadow:0 0 0 3px var(--amb-soft, rgba(0,0,0,.05));
  transition:box-shadow .2s;
}

/* ============================================================
   v4.27.14 — MICRO-INTERAZIONI POLISH
   Easing standard: cubic-bezier(.16,1,.3,1) (ease-out-expo)
   ============================================================ */

/* Section action: underline animato */
.section-action {
  position:relative;
  transition:color .15s;
}
.section-action::after {
  content:''; position:absolute; bottom:-2px; left:0; right:0;
  height:1px; background:var(--accent);
  transform:scaleX(0); transform-origin:right;
  transition:transform .25s cubic-bezier(.16,1,.3,1);
}
.section-action:hover::after { transform:scaleX(1); transform-origin:left; }

/* Topbar icons: hover scale */
.topbar-icon, .theme-toggle {
  transition:background .15s, color .15s, transform .15s cubic-bezier(.16,1,.3,1);
}
.topbar-icon:hover, .theme-toggle:hover {
  transform:scale(1.06);
}

/* Home/hero chips: shift orizzontale */
.home-chip, .hero-chip {
  transition:color .15s, border-color .15s, transform .15s cubic-bezier(.16,1,.3,1);
}
.home-chip:hover, .hero-chip:hover {
  transform:translateX(2px);
}

/* Hamb chip (ambiti home): leggera elevazione */
.hamb-chip {
  transition:background .15s, box-shadow .2s cubic-bezier(.16,1,.3,1), transform .2s cubic-bezier(.16,1,.3,1);
}
.hamb-chip:hover {
  transform:translateY(-1px);
  box-shadow:var(--shadow-2);
}

/* Social tile: scale sottile + shadow */
.sw-tile {
  transition:box-shadow .2s cubic-bezier(.16,1,.3,1), transform .2s cubic-bezier(.16,1,.3,1);
}
.sw-tile:hover {
  transform:translateY(-3px);
  box-shadow:var(--shadow-3);
}

/* Link bandi (br-link): transizione completa */
.br-link {
  transition:background .15s, color .15s, border-color .15s, transform .15s cubic-bezier(.16,1,.3,1);
}
.br-link:hover {
  transform:translateY(-1px);
}

/* Nav item: transizione fluida su tutti gli stati */
.nav-item {
  transition:background .15s, color .15s, transform .1s cubic-bezier(.16,1,.3,1);
}

/* v4.27.17 — Badge urgente: nessuna animazione (competenza silenziosa) */

/* Home-sw-item: hover con tint sottile */
.home-sw-item {
  transition:background .15s;
}
.home-sw-item:hover {
  background:var(--surface);
}

/* Prefers reduced motion: disabilita tutte le animazioni di delight */
@media (prefers-reduced-motion: reduce) {
  .nav-item:hover svg,
  .br-row:hover,
  .st-kpi-card:hover,
  .filter-chip:active,
  .sw-tile:hover,
  .hamb-chip:hover,
  .topbar-icon:hover,
  .theme-toggle:hover,
  .home-chip:hover,
  .hero-chip:hover,
  .br-link:hover,
  .btn.btn-primary:active { transform:none !important; }
  .br-act-save-on { animation:none !important; }
  .oc-toast.ok::before { animation:none !important; }
  .section-action::after { transition:none !important; }
}

/* ==========================================================
   DETAIL OVERLAY (scheda completa bando / news / podcast)
   ========================================================== */
#oc-detail-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 900;
  background: rgba(26,24,21,.45);

}

/* v4.18.68 — Bando Quick View Drawer: overlay leggero, lista resta visibile */

#drawerOverlay {

  inset: 0;

}

#bandoDrawer .drawer-topbar {

}
#bandoDrawer .drawer-close {

#bandoDrawer .drawer-body {

}
/* Skeleton dentro il drawer */

#bandoDrawer .drawer-skeleton .skeleton { margin-bottom: 12px; }

/* ===== GUIDA PANEL (Sprint N10) ===== */
#oc-guida-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 901;
  background: rgba(26,24,21,.45);

}

}

}
.guida-list {

}

}

#oc-detail-panel {

  background: var(--surface);

  overflow-y: auto;

}
@keyframes panel-in {

}

.detail-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rule);

  top: 0;
  background: var(--surface);

}
.detail-close {
  margin-left: auto;

  border: none;
  min-width: 44px; min-height: 44px;

  border-radius: 8px;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--ink-3);

}
.detail-close:hover { background: var(--surface-2); color: var(--ink); }

.detail-body {
  padding: 28px 28px 40px;

}
.detail-eyebrow {

}

}
.detail-title {

}
.detail-meta {

  gap: 8px 16px;

}
.detail-meta .dm-item {

}
.detail-meta .dm-label {

}
.detail-summary {

.detail-actions {

.detail-btn-primary {

/* ==========================================================
   HOME LIST ROW — bandi, news, podcast in lista riga
   ========================================================== */
.home-list-row {

.home-list-row:last-child { border-bottom: none; }

.home-list-row .hlr-left { min-width: 0; }
.home-list-row .hlr-right { text-align: right; flex-shrink: 0; white-space: nowrap; }

.home-list-row .hlr-tags {

}
.home-list-row .hlr-amb {

/* ============================================================
   v5.0 — UI primitives: bottoni, admin-card, digest-row, status
   ============================================================ */

/* === BOTTONI === */
.btn {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  padding: 10px 20px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  white-space: nowrap;
  line-height: 1.2;
  text-decoration: none;
  min-height: 38px;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:focus-visible {
  outline: 2px solid var(--accent); /* WCAG 2.4.7/1.4.11: ring visibile >=3:1 (era accent-soft ~1.1:1) */
  outline-offset: 1px;
  box-shadow: 0 0 0 4px var(--accent-soft);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none !important;
}

.btn-primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.btn-primary:hover { background: var(--ink); border-color: var(--ink); }
.btn-primary:disabled { background: var(--ink-4); border-color: var(--ink-4); color: var(--paper); }

.btn-secondary {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--rule);
}
.btn-secondary:hover {
  background: var(--surface);
  border-color: var(--ink);
}

.btn-outline {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.btn-outline:hover { background: var(--ink); color: var(--paper); }

.btn-accent,
.btn-gold {
  background: var(--accent);
  color: var(--paper);
  border-color: var(--accent);
}
.btn-accent:hover,
.btn-gold:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-warning {
  background: var(--paper);
  color: var(--warning);
  border-color: var(--warning);
}
.btn-warning:hover { background: var(--warning); color: var(--paper); border-color: var(--warning); }

.btn-danger {
  background: var(--paper);
  color: var(--danger);
  border-color: var(--danger);
}
.btn-danger:hover { background: var(--danger); color: var(--paper); border-color: var(--danger); }

.btn-ghost {
  background: transparent;
  color: var(--ink-3);
  border-color: transparent;
}
.btn-ghost:hover { color: var(--ink); background: var(--surface); }

/* Versione compatta */
.btn-sm { font-size: 12px; padding: 7px 14px; min-height: 30px; }

/* === ADMIN PANELS === */
.admin-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.admin-card {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: var(--r-lg);
  padding: 24px 26px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.admin-card h3 {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.2;
  color: var(--ink);
  margin: 0 0 4px;
}
.admin-card .hint {
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--ink-3);
  line-height: 1.55;
  margin: 0;
}
.admin-counts {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  padding: 12px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  margin: 4px 0 6px;
}
.admin-counts span {
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--ink-3);
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
}
.admin-counts b {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

/* === EMPTY STATE SMALL === */
.empty-state.sm {
  background: var(--surface);
  border: 1px dashed var(--rule);
  border-radius: var(--r-md);
  padding: 24px 20px;
  text-align: center;
  font-size: 13px;
  color: var(--ink-3);
  font-style: normal;
}

/* === DIGEST ROW (Bozze e invii recenti) === */
.digest-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  background: var(--paper);
  margin-bottom: 8px;
  transition: all .15s;
}
.digest-row:hover { border-color: var(--ink-3); background: var(--surface); }
.digest-row b {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.digest-row small {
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--ink-3);
  display: inline-block;
  margin-top: 2px;
}
.digest-row .digest-row-actions {
  display: flex;
  gap: 6px;
  margin-left: auto;
  flex-shrink: 0;
}

/* === STATUS BADGE === */
.status {
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-3);
  white-space: nowrap;
  flex-shrink: 0;
}
.status.bozza {
  background: var(--amb-8-soft);
  color: var(--amb-8);
}
.status.in_attesa_approvazione,
.status.in_attesa {
  background: var(--accent-soft);
  color: var(--accent-hover);
}
.status.inviato,
.status.inviata {
  background: var(--amb-2-soft);
  color: var(--success);
}
.status.errore,
.status.error {
  background: oklch(0.94 0.03 25);
  color: var(--danger);
}

/* === MUTED === */
.muted {
  color: var(--ink-3);
  font-size: 12px;
}

/* === PREVIEW IFRAME === */
.preview-iframe {
  width: 100%;
  height: 600px;
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  background: var(--paper);
}

/* === SETTINGS TABS === */
.settings-tab {
  background: transparent;
  border: none;
  padding: 10px 18px;
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--ink-3);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  cursor: pointer;
  transition: all .15s;
}
.settings-tab:hover { color: var(--ink); }
.settings-tab.active {
  color: var(--ink);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

.home-list-row .hlr-scad.urgent { color: var(--danger); }

/* ==========================================================
   DELIGHT v5.1 — micro-interazioni raffinate
   Personalita e memoria per un'app che il professionista
   museale ricorda e a cui torna ogni settimana.
   ========================================================== */

/* ── 1. Page fade-in: ingresso pagina con dissolvenza ────── */
@keyframes page-enter {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.page.active {
  animation: page-enter .28s cubic-bezier(.25,1,.5,1) both;
}

/* ── 2. Topbar progress bar: caricamento dati ────────────── */
@keyframes topbar-load {
  0%   { width: 0; }
  20%  { width: 35%; }
  60%  { width: 70%; }
  100% { width: 92%; }
}
@keyframes topbar-done {
  from { width: 92%; opacity: 1; }
  to   { width: 100%; opacity: 0; }
}
.topbar.loading::after {
  width: auto;
  opacity: 1;
  animation: topbar-load 2.5s cubic-bezier(.4,0,.2,1) forwards;
}
.topbar.loaded::after {
  animation: topbar-done .4s ease forwards;
}

/* ── 3. Empty state: illustrativi, con CTA ───────────────── */
.empty-state svg.empty-ill {
  display: block;
  margin: 0 auto 14px;
  opacity: .35;
  color: var(--ink-3);
}
.empty-state .empty-hint {
  display: block;
  margin-top: 8px;
  font-size: .8125rem;
  font-style: normal;
  color: var(--ink-4);
  line-height: 1.5;
}
.empty-state .empty-cta {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 18px;
  font-size: .8125rem;
  font-weight: 500;
  font-style: normal;
  color: var(--accent, #935851);
  border: 1px solid var(--accent, #935851);
  border-radius: 6px;
  background: none;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.empty-state .empty-cta:hover {
  background: var(--accent, #935851);
  color: var(--paper);
}

/* ── 4. Toast con undo: bottone inline ───────────────────── */
.oc-toast .toast-undo {
  margin-left: 8px;
  padding: 2px 10px;
  font-size: .75rem;
  font-weight: 600;
  color: var(--paper);
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 4px;
  cursor: pointer;
  transition: background .15s;
  white-space: nowrap;
}
.oc-toast .toast-undo:hover {
  background: rgba(255,255,255,.32);
}

/* ── 5. Item letto: raffinamento visivo ──────────────────── */
.item-letto {
  opacity: .55;
  transition: opacity .2s;
}
.item-letto:hover {
  opacity: .8;
}
.item-letto .br-title,
.item-letto .bando-row-title,
.item-letto .news-title,
.item-letto .pod-title {
  text-decoration: none;
  color: var(--ink-3);
}

/* ── 6. Counter count-up: numeri che appaiono ────────────── */
@keyframes count-reveal {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.hstat b, .st-kpi-val, .hamb-count {
  animation: count-reveal .35s cubic-bezier(.25,1,.5,1) both;
}

/* ── 7. Badge "Nuovo" pulse sottile ──────────────────────── */
@keyframes badge-new-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232,75,28,.25); }
  50%      { box-shadow: 0 0 0 4px rgba(232,75,28,.08); }
}
.br-badge-new {
  animation: badge-new-pulse 2.5s ease-in-out 2;
}

/* ── 8. Drawer slide-in raffinato ────────────────────────── */
#bandoDrawer {
  transition: right 0.32s cubic-bezier(0.22,1,0.36,1);
}
#drawerOverlay {
  opacity: 0;
  transition: opacity 0.28s ease;
}
#drawerOverlay.active {
  opacity: 1;
}

/* ── 9. Greeting: scale sottile al mount ─────────────────── */
@keyframes greet-in {
  from { opacity: 0; transform: scale(.97); }
  to   { opacity: 1; transform: scale(1); }
}
#homeGreeting {
  animation: greet-in .45s cubic-bezier(.25,1,.5,1) both;
}

/* ── 10. Scroll progress: barra sottile sotto topbar ─────── */
.topbar.scroll-active::after {
  width: var(--scroll-pct, 0%);
  opacity: .2;
  transition: width .08s linear;
}

/* ── Reduced motion: rispetto preferenze utente ──────────── */
@media (prefers-reduced-motion: reduce) {
  .page.active,
  .hstat b, .st-kpi-val, .hamb-count,
  #homeGreeting,
  .br-badge-new { animation: none !important; }
  .topbar.loading::after,
  .topbar.loaded::after { animation: none !important; }
  .nav-item:hover svg,
  .br-row:hover,
  .st-kpi-card:hover,
  .filter-chip:active,
  .btn.btn-primary:active { transform: none !important; }
  .br-act-save-on { animation: none !important; }
  .oc-toast.ok::before { animation: none !important; }
}
