<!--
  ============================================================
  OSSERVATORIO CULTURALE / MUSEMU MATRIX — STILES.HTML
  v5.0 — Direzione C Curatoriale Sans (24/05/2026)
  Palette: bianco puro + ink #101010 + accent vermillion #935851
  Tipografia: Inter + Inter Tight (sans-only)
  9 dimensioni MuseMu Matrix ricalibrate per fondo bianco
  Sinopia / Silvano Straccini
  ============================================================
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
/* ==========================================================
   OSSERVATORIO CULTURALE — Redesign Editoriale Museale
   Light + Dark mode, carta da museo, tipografia editoriale
   ========================================================== */

:root{
  /* v4.27.3 — Palette OKLCH: La Regola della Carta (mai bianco puro, mai nero puro) */

  /* Neutri caldi — arriccio del museo */
  --paper:oklch(0.98 0.005 70);        /* #FAFAF7 equiv — carta museale */
  --paper-2:oklch(0.97 0.007 70);      /* #F7F5F0 equiv — carta calda */
  --surface:oklch(0.96 0.008 70);      /* #F5F3EE equiv — superficie */
  --surface-2:oklch(0.94 0.008 70);    /* #EDEBE6 equiv — superficie profonda */
  --rule:oklch(0.91 0.004 260);        /* #E5E5E7 equiv — riga */
  --rule-2:oklch(0.85 0.004 260);      /* #D2D2D7 equiv — riga forte */
  --rule-strong:oklch(0.14 0.005 70);  /* #101010 equiv — riga massima */

  /* Inchiostro — mai nero puro */
  --ink:oklch(0.14 0.005 70);          /* #101010 equiv — tintato caldo */
  --ink-2:oklch(0.32 0.008 70);        /* #3A3A3C equiv */
  --ink-3:oklch(0.50 0.006 260);       /* #6E6E73 equiv */
  --ink-4:oklch(0.46 0.006 260);       /* ~#6B6B70 — WCAG AA 5.2:1 su carta (fix v4.27.37) */
  --ink-5:oklch(0.85 0.004 260);       /* #D2D2D7 equiv */

  /* Terracotta Sinopia — il pigmento del disegno preparatorio */
  --accent:oklch(0.52 0.08 22);        /* #935851 equiv */
  --accent-soft:oklch(0.94 0.02 22);   /* #F0E6E4 equiv */
  --accent-hover:oklch(0.44 0.08 22);  /* #7A4940 equiv */
  --link:oklch(0.52 0.08 22);
  --link-hover:oklch(0.44 0.08 22);

  /* 5 dimensioni MuseMu Matrix */
  --amb-1:oklch(0.50 0.24 290);  /* 01 Brand — viola elettrico */
  --amb-2:oklch(0.58 0.14 165);  /* 02 Collezione — verde smeraldo */
  --amb-3:oklch(0.52 0.18 260);  /* 03 Edificio — blu cobalto */
  --amb-4:oklch(0.46 0.12 55);   /* 04 Programma/Servizio — arancio sinopia */
  --amb-5:oklch(0.52 0.10 210);  /* 05 Digital/Pubblico — petrolio profondo */

  /* tinte chiare degli ambiti per fondo medaglione */
  --amb-1-soft:oklch(0.95 0.04 290);
  --amb-2-soft:oklch(0.95 0.04 165);
  --amb-3-soft:oklch(0.95 0.04 260);
  --amb-4-soft:oklch(0.95 0.04 55);
  --amb-5-soft:oklch(0.95 0.04 210);

  /* Compatibilita Matrix (dimensioni 6-10) */
  --amb-6:oklch(0.48 0.20 260); --amb-7:oklch(0.48 0.20 300); --amb-8:oklch(0.52 0.14 70);
  --amb-9:oklch(0.18 0.005 70); --amb-10:oklch(0.52 0.18 350);
  --amb-6-soft:oklch(0.94 0.04 260); --amb-7-soft:oklch(0.94 0.04 300); --amb-8-soft:oklch(0.95 0.04 80);
  --amb-9-soft:oklch(0.92 0.004 260); --amb-10-soft:oklch(0.95 0.04 350);

  --text-muted:oklch(0.50 0.006 260);

  /* Semantici */
  --danger:oklch(0.50 0.16 30);
  --warning:oklch(0.52 0.14 70);
  --success:oklch(0.52 0.10 165);

  --font-display:'Inter Tight','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-italic:'Inter','Inter Tight',sans-serif;
  --font-ui:'Inter','Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-serif:'EB Garamond', Georgia, serif;
  --font-mono:ui-monospace,'JetBrains Mono',monospace;

  /* Alias compatibilita componenti GAS esistenti */
  --bg:var(--paper);
  --surface-alt:var(--surface-2);
  --border:var(--rule);
  --border-strong:var(--rule-2);
  --ink-2-alias:var(--ink-2);

  --sidebar-w:280px;
  --topbar-h:64px;

  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --radius:var(--r-md);
  --radius-lg:var(--r-lg);

  --shadow-soft:0 0 0 1px oklch(0.14 0.005 70 / 0.04);
  --shadow-1:var(--shadow-soft);
  --shadow-2:0 1px 3px oklch(0.14 0.005 70 / 0.06), 0 0 0 1px oklch(0.14 0.005 70 / 0.04);
  --shadow-3:0 8px 24px -8px oklch(0.14 0.005 70 / 0.12), 0 0 0 1px oklch(0.14 0.005 70 / 0.04);
}

/* ── Accessibilità: 3 livelli testo (data-fontsize = "" | "large" | "xlarge") ───
   Livello 1 (large): +15% — attivato con 1° click sul pulsante A in topbar
   Livello 2 (xlarge): +30% — attivato con 2° click
   Preferenza salvata in localStorage('oc-fontsize').
   ──────────────────────────────────────────────────────────────────────────── */

/* ── Livello 1: large ────────────────────────────────────────────── */
[data-fontsize="large"] .br-title,
[data-fontsize="large"] .nr-row .br-title,
[data-fontsize="large"] .pd-row .br-title,
[data-fontsize="large"] .lb-row .br-title,
[data-fontsize="large"] .vd-row .br-title  { font-size: 20px; line-height: 1.45; }

[data-fontsize="large"] .br-meta,
[data-fontsize="large"] .nr-data,
[data-fontsize="large"] .nr-fonte,
[data-fontsize="large"] .pd-show,
[data-fontsize="large"] .sw-tile-excerpt,
[data-fontsize="large"] .sw-excerpt,
[data-fontsize="large"] .home-sw-title    { font-size: 13px; }

[data-fontsize="large"] .sw-tile-title    { font-size: 14px; }

[data-fontsize="large"] .br-row           { padding: 14px 16px; gap: 14px; }

[data-fontsize="large"] .br-acts button,
[data-fontsize="large"] .br-act-read,
[data-fontsize="large"] .br-act-arch,
[data-fontsize="large"] .br-act-trash,
[data-fontsize="large"] .br-act-save      { font-size: 12.5px; padding: 5px 10px; }

[data-fontsize="large"] .nav-item .lbl    { font-size: 14px; }
[data-fontsize="large"] .nav-label        { font-size: 11px; }

[data-fontsize="large"] .filter-chip      { font-size: 13px; padding: 6px 14px; }

[data-fontsize="large"] .section-title    { font-size: 1.25rem; }
[data-fontsize="large"] .sw-section-label { font-size: 13px; }

[data-fontsize="large"] .hstat b          { font-size: 1.4rem; }
[data-fontsize="large"] .hstat span       { font-size: 12px; }

/* ── Livello 2: xlarge ───────────────────────────────────────────── */
[data-fontsize="xlarge"] .br-title,
[data-fontsize="xlarge"] .nr-row .br-title,
[data-fontsize="xlarge"] .pd-row .br-title,
[data-fontsize="xlarge"] .lb-row .br-title,
[data-fontsize="xlarge"] .vd-row .br-title { font-size: 23px; line-height: 1.5; }

[data-fontsize="xlarge"] .br-meta,
[data-fontsize="xlarge"] .nr-data,
[data-fontsize="xlarge"] .nr-fonte,
[data-fontsize="xlarge"] .pd-show,
[data-fontsize="xlarge"] .sw-tile-excerpt,
[data-fontsize="xlarge"] .sw-excerpt,
[data-fontsize="xlarge"] .home-sw-title   { font-size: 14px; }

[data-fontsize="xlarge"] .sw-tile-title   { font-size: 16px; line-height: 1.45; }

[data-fontsize="xlarge"] .br-row          { padding: 17px 20px; gap: 16px; }

[data-fontsize="xlarge"] .br-acts button,
[data-fontsize="xlarge"] .br-act-read,
[data-fontsize="xlarge"] .br-act-arch,
[data-fontsize="xlarge"] .br-act-trash,
[data-fontsize="xlarge"] .br-act-save     { font-size: 13.5px; padding: 6px 12px; }

[data-fontsize="xlarge"] .nav-item .lbl   { font-size: 15px; }
[data-fontsize="xlarge"] .nav-label       { font-size: 12px; }

[data-fontsize="xlarge"] .filter-chip     { font-size: 14px; padding: 7px 16px; }

[data-fontsize="xlarge"] .section-title   { font-size: 1.4rem; }
[data-fontsize="xlarge"] .sw-section-label{ font-size: 14px; }

[data-fontsize="xlarge"] .hstat b         { font-size: 1.6rem; }
[data-fontsize="xlarge"] .hstat span      { font-size: 13px; }

[data-fontsize="xlarge"] .sw-tile         { padding: 20px; }
[data-fontsize="xlarge"] .sw-tile-fonte   { font-size: 13px; }
[data-fontsize="xlarge"] .sw-tile-date    { font-size: 12px; }

[data-theme="dark"]{
  /* v4.27.3 — Dark mode OKLCH: neutri caldi tintati, mai nero puro */
  --paper:oklch(0.13 0.008 55);
  --paper-2:oklch(0.16 0.010 55);
  --surface:oklch(0.16 0.010 55);
  --surface-2:oklch(0.20 0.010 55);
  --rule:oklch(0.25 0.012 55);
  --rule-2:oklch(0.30 0.012 55);
  --rule-strong:oklch(0.97 0.005 70);

  --ink:oklch(0.97 0.005 70);
  --ink-2:oklch(0.91 0.004 260);
  --ink-3:oklch(0.68 0.006 260);
  --ink-4:oklch(0.62 0.006 260);       /* v4.27.37 — fix contrasto dark: ~5.0:1 su dark paper */
  --ink-5:oklch(0.40 0.006 260);

  --accent:oklch(0.62 0.07 22);
  --accent-soft:oklch(0.22 0.04 22);
  --accent-hover:oklch(0.72 0.06 22);
  --link:oklch(0.62 0.07 22);
  --link-hover:oklch(0.72 0.06 22);

  --text-muted:oklch(0.68 0.006 260);

  --amb-1:oklch(0.70 0.18 290);
  --amb-2:oklch(0.76 0.14 165);
  --amb-3:oklch(0.72 0.14 260);
  --amb-4:oklch(0.72 0.14 55);
  --amb-5:oklch(0.78 0.10 210);
  --amb-6:oklch(0.66 0.16 260);
  --amb-7:oklch(0.68 0.18 300);
  --amb-8:oklch(0.80 0.14 85);
  --amb-9:oklch(0.97 0.005 70);
  --amb-10:oklch(0.72 0.16 350);

  --amb-1-soft:oklch(0.20 0.06 290);
  --amb-2-soft:oklch(0.20 0.04 165);
  --amb-3-soft:oklch(0.20 0.04 260);
  --amb-4-soft:oklch(0.20 0.04 55);
  --amb-5-soft:oklch(0.20 0.04 210);
  --amb-6-soft:oklch(0.20 0.04 260);
  --amb-7-soft:oklch(0.20 0.04 300);
  --amb-8-soft:oklch(0.20 0.04 85);
  --amb-9-soft:oklch(0.22 0.005 260);
  --amb-10-soft:oklch(0.20 0.04 350);
}

/* v4.27.38 — Dark mode: 3 modali statici (registrazione, newsletter, prenotazione) */
[data-theme="dark"] #oc-reg-overlay > div[role="dialog"],
[data-theme="dark"] #oc-newsletter-overlay > div[role="dialog"],
[data-theme="dark"] #oc-prenota-panel {
  background:var(--paper) !important; color:var(--ink) !important;
  border:1px solid var(--rule);
}
[data-theme="dark"] #oc-reg-overlay [style*="background:linear-gradient"] {
  background:var(--surface-2) !important; border-bottom-color:var(--rule) !important;
}
[data-theme="dark"] #oc-reg-overlay input,
[data-theme="dark"] #oc-newsletter-overlay input,
[data-theme="dark"] #oc-prenota-overlay input,
[data-theme="dark"] #oc-prenota-overlay textarea,
[data-theme="dark"] #oc-prenota-overlay select {
  background:var(--surface) !important; color:var(--ink) !important;
  border-color:var(--rule) !important;
}
[data-theme="dark"] #oc-newsletter-overlay [style*="border-top"] {
  border-top-color:var(--rule) !important;
}
[data-theme="dark"] #oc-prenota-overlay .b-field-label,
[data-theme="dark"] #oc-prenota-overlay label {
  color:var(--ink-2) !important;
}

/* v4.27.37 — WCAG 2.4.1 Skip navigation */
.skip-link{
  position:absolute; top:-100%; left:16px; z-index:9999;
  background:var(--ink); color:var(--paper); padding:8px 16px;
  border-radius:0 0 8px 8px; font-size:14px; font-weight:600;
  text-decoration:none; transition:top .2s;
}
.skip-link:focus{ top:0; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* v4.18.68 — Viewport lock per iframe: scroll solo dentro .main-content */
html{ font-size:16px; line-height:1.5; height:100vh; overflow:hidden; }
body{
  font-family:var(--font-ui);
  font-size:1rem;
  line-height:1.55;
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-feature-settings:'cv11','ss01';
  letter-spacing:-0.005em;
  height:100vh;
  overflow:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.serif,
.display{font-family:var(--font-display);letter-spacing:-0.02em;font-weight:500}
.italic{font-family:var(--font-display);font-style:normal;letter-spacing:-0.01em}

/* v4.27.17 — Gerarchia tipografica: ratio 1.3x+, peso 600 per leggibilita su schermo */
h1,h2,h3,h4{font-family:var(--font-serif);letter-spacing:-0.025em;line-height:1.15;font-weight:600;margin:0}
h1{font-size:2.5rem;font-weight:600}
h2{font-size:1.75rem}
h3{font-size:1.3rem}
h4{font-size:1rem}

/* ==========================================================
   APP LAYOUT
   ========================================================== */
.app{
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  height:100vh;
  overflow:hidden;
}

/* ==========================================================
   SIDEBAR
   ========================================================== */
.sidebar{
  background:var(--paper);
  border-right:1px solid var(--rule);
  position:sticky; top:0;
  height:100vh; overflow-y:auto;
  padding:24px 18px 18px 22px;
  display:flex; flex-direction:column;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:3px}

/* Brand wordmark */
.brand{
  padding:0 4px 22px 4px;
  border-bottom:1px solid var(--rule);
  margin-bottom:18px;
}
/* Compatibilità con HTML esistente (.brand .logo .name) */
.brand .logo{
  display:none; /* nascosto — usiamo brand-mark CSS */
}
.brand-mark{
  display:flex; align-items:baseline; gap:0;
  font-family:var(--font-display);
  font-size:1.5rem;
  font-weight:600;
  letter-spacing:-0.02em;
  color:var(--ink);
  line-height:1;
}
.brand-mark .lens{
  display:inline-grid; place-items:center;
  width:22px; height:22px;
  border:1.5px solid currentColor;
  border-radius:50%;
  margin-right:1px;
  position:relative;
  transform:translateY(2px);
}
.brand-mark .lens::after{
  content:''; position:absolute;
  right:-3px; bottom:-1px;
  width:7px; height:1.5px;
  background:currentColor;
  transform:rotate(45deg);
  transform-origin:left center;
}
.brand-mark b{font-weight:600}
.brand-sub,.brand .name span{
  margin-top:4px;
  font-size:0.75rem;
  color:var(--ink-3);
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:600;
  display:block;
  font-family:var(--font-ui);
}
.brand .name{display:flex;flex-direction:column;line-height:1.2}
.brand .name b{
  font-family:var(--font-display);
  font-weight:600; font-size:1.5rem;
  color:var(--ink); letter-spacing:-0.02em;
}

/* Nav groups */
.nav-group{margin-bottom:22px}
.nav-label{
  font-size:0.75rem; font-weight:600;
  color:var(--ink-3);
  letter-spacing:.12em;
  text-transform:uppercase;
  padding:0 10px 8px 10px;
  display:flex; justify-content:space-between; align-items:center;
}
.nav-label .num{
  color:var(--ink-4);
  font-variant-numeric:tabular-nums;
  letter-spacing:.04em;
}

.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:8px 10px;
  border-radius:var(--r-sm);
  font-size:1rem;
  color:var(--ink-2);
  cursor:pointer;
  transition:background .15s, color .15s;
  width:100%; text-align:left;
  font-weight:600;
}
.nav-item svg{
  width:28px !important; height:28px !important;
  min-width:28px; min-height:28px;
  flex:0 0 28px;
  padding:4px;
  box-sizing:content-box;
  border:1.5px solid var(--rule);
  border-radius:7px;
  opacity:1;
  display:block;
}
.nav-item .lbl,.nav-item span:first-of-type:not(.amb-dot):not(.amb-num):not(.amb-name){flex:1}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
/* v4.27.3 — Active nav: background tint + icona accent (no side-stripe) */
.nav-item.active{
  background:var(--accent-soft);
  color:var(--ink);
  font-weight:600;
  border-radius:var(--r-sm);
}
.nav-item.active::before{ display:none; }
.nav-item.active svg{opacity:1;border-color:var(--accent);color:var(--accent)}
.nav-item.active .badge{background:transparent;color:var(--ink-3)}

.nav-badge,.badge{
  font-size:0.75rem; font-weight:600;
  color:var(--ink-3);
  font-variant-numeric:tabular-nums;
  letter-spacing:0;
}
.nav-badge.urgent,.badge.urgent,.badge.alert{color:var(--danger)}
.nav-badge.urgent::before,.badge.urgent::before{
  content:'•'; margin-right:3px;
}
.nav-badge-new{
  font-family:var(--font-ui); background:rgba(107,33,168,.12); color:#6B21A8 !important;
  border-radius:3px; padding:0 3px; font-size:0.5625rem !important;
  font-weight:400; letter-spacing:.01em; line-height:1.5;
  margin-left:auto; white-space:nowrap; opacity:.85;
}
.nav-badge-new::before{ content:'new '; }
[data-theme="dark"] .nav-badge-new{ background:rgba(124,58,237,.15); color:#A78BFA !important; }
.af-sublabel{
  font-size:0.625rem; font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-3); opacity:.6;
  padding:8px 12px 2px 14px; margin:0;
}
.af-sublabel:first-child{ padding-top:4px; }

/* Ambito items */
.nav-item.amb{padding-left:10px}
.amb-dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--amb,var(--ink-3));
  flex:0 0 7px;
}
.amb-num{
  font-family:var(--font-display);
  font-size:0.75rem;
  color:var(--ink-3);
  letter-spacing:.08em;
  font-variant-numeric:tabular-nums;
  margin-right:8px;
  min-width:18px;
}
.amb-name,.nav-item.amb span:last-of-type{
  flex:1; font-size:13px; font-weight:400; line-height:1.3;
}
.nav-item.amb.active{
  background:var(--amb-soft, var(--surface-2));
  font-weight:600;
}
.nav-item.amb.active::before{ display:none; }
.nav-item.amb.active .amb-num{color:var(--amb)}
.nav-item.amb.active .amb-name{color:var(--ink)}

/* Ambiti color mapping */
.nav-item.amb.a1,.a1{--amb:var(--amb-1);--amb-soft:var(--amb-1-soft)}
.nav-item.amb.a2,.a2{--amb:var(--amb-2);--amb-soft:var(--amb-2-soft)}
.nav-item.amb.a3,.a3{--amb:var(--amb-3);--amb-soft:var(--amb-3-soft)}
.nav-item.amb.a4,.a4{--amb:var(--amb-4);--amb-soft:var(--amb-4-soft)}
.nav-item.amb.a5,.a5{--amb:var(--amb-5);--amb-soft:var(--amb-5-soft)}
.nav-item.amb.a6,.a6{--amb:var(--amb-6)}
.nav-item.amb.a7,.a7{--amb:var(--amb-7)}
.nav-item.amb.a8,.a8{--amb:var(--amb-8)}
.nav-item.amb.a9,.a9{--amb:var(--amb-9)}
.nav-item.amb.a10,.a10{--amb:var(--amb-10)}

/* Strumento speciale (Matrix) */
.nav-item.nav-item-matrix,.nav-item.matrix{
  border:1px solid var(--rule);
  padding:10px 12px;
  margin-top:2px;
  background:var(--surface);
  border-radius:var(--r-sm);
}
.nav-item.nav-item-matrix:hover,.nav-item.matrix:hover{
  border-color:var(--rule-2);background:var(--surface);
}
.matrix-tag{
  font-family:var(--font-display);
  font-style:italic;
  font-size:0.75rem;
  color:var(--ink-3);
  font-weight:400;
  letter-spacing:0;
}

/* Sidebar footer */
.sidebar-footer{
  margin-top:auto;
  padding-top:14px;
  border-top:1px solid var(--rule);
  display:flex; flex-direction:column; gap:10px;
}
.user-card{
  display:flex; align-items:center; gap:11px;
  padding:8px 10px;
  border-radius:var(--r-sm);
  cursor:pointer;
}
.user-card:hover{background:var(--surface-2)}
.user-avatar,.user-avatar.sm{
  width:30px; height:30px; border-radius:50%;
  background:var(--ink);
  color:var(--paper);
  font-size:0.75rem; font-weight:600;
  display:grid; place-items:center;
  font-family:var(--font-ui);
  letter-spacing:.04em;
  flex:0 0 30px;
}
.user-info,.user-info.sm{display:flex;flex-direction:column;line-height:1.25;flex:1;min-width:0}
.user-info b,.user-info.sm b{font-size:1rem;font-weight:600;color:var(--ink)}
.user-info span,.user-info.sm span{font-size:0.75rem;color:var(--ink-3);text-transform:lowercase}

/* ==========================================================
   MAIN + TOPBAR
   ========================================================== */
.main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

.topbar{
  position:sticky; top:0; z-index:10;
  height:var(--topbar-h);
  background:rgba(250,250,247,.92);
  backdrop-filter:saturate(150%) blur(4px);
  -webkit-backdrop-filter:saturate(150%) blur(4px);
  border-bottom:1px solid var(--rule);
  display:flex; align-items:center; gap:18px;
  padding:0 36px;
}
[data-theme="dark"] .topbar{background:rgba(26,24,21,.92)}

/* v5.6 — Leggibilità dark mode: card/form con background bianco fisso e select-filtro */
[data-theme="dark"] #profiloProContent > div{
  background:var(--surface,#141414) !important;
  border-color:var(--rule,#27272A) !important;
}
[data-theme="dark"] #profiloProContent select,
[data-theme="dark"] #profiloProContent input,
[data-theme="dark"] #profiloProContent textarea{
  background:var(--paper) !important; color:#101010 !important; border-color:#D0D0D0 !important;
}
[data-theme="dark"] #profiloProContent select option{ background:var(--paper); color:#101010; }
[data-theme="dark"] .filter-select{
  background:var(--surface-2,#1F1F1F) !important;
  color:var(--ink,#FAFAFA) !important;
  border-color:var(--rule-2,#3F3F46) !important;
}
[data-theme="dark"] .filter-select option{ background:var(--surface-2); color:var(--ink); }
/* input ricerca Bandi: sfondo bianco fisso → forza testo scuro leggibile in dark */
[data-theme="dark"] #bandiSearch{ color:var(--ink) !important; }

/* Hamburger mobile */
.topbar-hamburger,.menu-btn{
  display:none; width:36px; height:36px;
  border-radius:var(--r-sm);
  place-items:center; color:var(--ink-2);
  flex:0 0 36px;
}

.breadcrumb{
  font-size:0.875rem;
  color:var(--ink-3);
  display:flex; align-items:center; gap:8px;
  flex:0 0 auto;
  font-family:var(--font-display);
  font-style:italic;
  font-weight:400;
  letter-spacing:0;
}
.breadcrumb b{
  color:var(--ink); font-weight:600;
  font-style:normal;
  font-family:var(--font-ui);
  letter-spacing:0;
  font-size:1rem;
}
.breadcrumb .sep{color:var(--ink-4);font-style:normal}
.breadcrumb a:hover{text-decoration:underline}

/* Search topbar */
.topbar-search,.search-wrap{
  flex:1; max-width:520px;
  margin:0 auto;
  position:relative;
  display:flex; align-items:center;
  height:38px;
  border:1px solid var(--rule);
  border-radius:var(--r-sm);
  background:var(--surface);
  padding:0 14px;
  transition:border-color .15s, background .15s;
}
.topbar-search:focus-within,.search-wrap:focus-within{
  border-color:var(--rule-strong);
  background:var(--surface);
}
.topbar-search svg,.search-wrap svg{color:var(--ink-3); flex:0 0 16px}
.topbar-search input,.search,.search-wrap input{
  flex:1; border:none; outline:none;
  background:transparent;
  font-family:var(--font-ui);
  font-size:1rem;
  color:var(--ink);
  padding:0 12px;
  height:100%;
  width:100%;
}
.topbar-search input::placeholder,.search::placeholder,.search-wrap input::placeholder{color:var(--ink-4)}
.kbd,.search-kbd,.topbar-search .kbd{
  font-size:0.75rem;
  color:var(--ink-3);
  font-family:var(--font-ui);
  font-weight:600;
  letter-spacing:.05em;
  padding:2px 5px;
  border:1px solid var(--rule);
  border-radius:3px;
  background:var(--paper-2);
}

/* INT-5: nascondi search topbar in home */
body.is-home-page .topbar-search{display:none}

.topbar-actions,.top-actions{display:flex;align-items:center;gap:4px}

.topbar-icon,.icon-btn{
  width:36px; height:36px; border-radius:8px;
  display:grid; place-items:center;
  color:var(--accent);
  border:1.5px solid var(--rule);
  position:relative;
  transition:all .15s;
}
.topbar-icon:hover,.icon-btn:hover{background:var(--surface-2);color:var(--accent);border-color:var(--accent)}
.topbar-icon .dot,.notif-dot{
  position:absolute; top:9px; right:10px;
  width:6px; height:6px; border-radius:50%;
  background:var(--danger);
  border:1.5px solid var(--paper);
}
.topbar-badge{
  position:absolute; top:6px; right:6px;
  min-width:16px; height:16px; padding:0 4px;
  border-radius:8px;
  background:var(--danger); color:var(--paper);
  font-size:0.75rem; font-weight:700;
  display:grid; place-items:center;
}

/* User chip in topbar */
.topbar-user,.user-chip{
  display:flex; align-items:center; gap:10px;
  padding:5px 10px 5px 5px; border-radius:24px;
  border:1px solid var(--rule); background:var(--surface);
  cursor:pointer;
}
.topbar-user:hover,.user-chip:hover{background:var(--surface-2)}

.theme-toggle{
  width:36px; height:36px; border-radius:var(--r-sm);
  display:grid; place-items:center;
  color:var(--ink-2);
  transition:background .15s;
  cursor:pointer;
}
.theme-toggle:hover{background:var(--surface-2);color:var(--ink)}

/* ==========================================================
   PAGE
   ========================================================== */
/* v4.27.5 — Spacing ritmato: piu respiro in alto, compressione progressiva */
.page{
  padding:40px 48px 64px 48px;
  max-width:1320px;
  width:100%;
  display:none;
}
.page.active{display:block}

/* ==========================================================
   HOME — Editoriale
   ========================================================== */
/* v4.27.5 — Masthead: ritmo asimmetrico */
.home-masthead{
  border-top:1px solid var(--rule-strong);
  padding-top:20px;
  margin-bottom:40px;
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:28px;
}
.masthead-meta{
  font-family:var(--font-display);
  font-style:italic;
  font-size:1rem;
  color:var(--ink-3);
  letter-spacing:0;
  display:flex; flex-direction:column; gap:2px;
}
.masthead-meta b{
  font-style:normal;
  font-family:var(--font-ui);
  font-size:0.75rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink);
  font-weight:600;
}
.masthead-update{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display); font-style:italic;
  font-size:1rem; color:var(--ink-3);
}
.update-dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--success);
  position:relative;
  flex:0 0 6px;
}
.update-dot::after{
  content:''; position:absolute; inset:-3px; border-radius:50%;
  border:1px solid var(--success); opacity:.4;
}


/* Hero headliner */
.hero-eyebrow{
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3);
  margin-bottom:12px;
}
.home-headline,.hero h1{
  margin:0 0 28px 0;
  font-family:var(--font-display);
  font-weight:600;
  font-size:3.2rem;
  line-height:1.05;
  letter-spacing:-0.025em;
  color:var(--ink);
  max-width:18ch;
}
.home-headline em,.hero h1 em{
  font-family:var(--font-italic);
  font-style:italic;
  font-weight:400;
  color:var(--ink);
}
.home-deck,.hero p{
  font-family:var(--font-display);
  font-size:1.4rem;
  line-height:1.45;
  color:var(--ink-2);
  max-width:60ch;
  margin:0 0 36px 0;
  font-weight:400;
}

/* Hero — hero generico (per compatibilità vecchi componenti) */
.hero{
  background:var(--paper);
  color:var(--ink);
  border-bottom:1px solid var(--rule-strong);
  padding:0 0 36px 0;
  margin-bottom:36px;
  position:relative;
}

/* Search hero — minimale, editoriale */
.home-search,.hero-search{
  display:flex; align-items:center;
  border-top:1px solid var(--rule-strong);
  border-bottom:1px solid var(--rule-strong);
  padding:14px 0;
  margin-bottom:14px;
  gap:14px;
}
.home-search svg,.hero-search svg{color:var(--ink-3); flex:0 0 18px}
.home-search input,.hero-search input{
  flex:1; border:none; outline:none;
  background:transparent;
  font-family:var(--font-display);
  font-size:1.25rem;
  color:var(--ink);
  padding:6px 0;
  font-style:italic;
  font-weight:400;
}
.home-search input::placeholder,.hero-search input::placeholder{color:var(--ink-4);font-style:italic}
.home-search button,.hero-search button{
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink);
  padding:8px 14px;
  border:1px solid var(--rule-strong);
  border-radius:var(--r-sm);
  background:transparent;
  transition:background .15s, color .15s;
}
.home-search button:hover,.hero-search button:hover{background:var(--ink);color:var(--paper)}

/* Chips suggerimento */
.home-chips,.hero-chips{
  display:flex; flex-wrap:wrap; gap:6px 14px;
  margin-bottom:64px;
  font-family:var(--font-display);
  font-style:italic;
  font-size:1rem;
  color:var(--ink-3);
}
.home-chips .label{
  font-style:normal;font-family:var(--font-ui);
  text-transform:uppercase;letter-spacing:.14em;
  font-size:0.75rem;color:var(--ink-4);
  font-weight:600;align-self:center;margin-right:4px;
}
.home-chip,.hero-chip{
  cursor:pointer;
  border-bottom:1px solid var(--rule);
  padding-bottom:1px;
  font-size:1rem; font-style:italic;
  font-family:var(--font-display);
  color:var(--ink-3);
  background:none; border-top:none; border-left:none; border-right:none;
  border-radius:0;
  transition:color .15s, border-color .15s;
}
.home-chip:hover,.hero-chip:hover{color:var(--ink);border-color:var(--ink)}

/* ---- Stats bar — v4.27.3: lista editoriale inline (no metriche-hero) ---- */
.home-stats-bar{
  display:flex; flex-wrap:wrap; align-items:baseline;
  gap:4px 0;
  margin:24px 0 8px;
  padding:10px 0;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  font-family:var(--font-ui);
  font-size:0.8125rem;
  color:var(--ink-3);
  letter-spacing:0.02em;
}
.hstat{
  display:inline-flex; align-items:baseline; gap:4px;
  text-decoration:none; color:var(--ink-3);
  font-family:var(--font-ui);
  transition:color .15s;
}
/* v4.27.17 — numeri stats piu visibili: peso 700, colore ink (non ink-2) */
.hstat b{ font-size:0.875rem; font-weight:700; line-height:1; color:var(--ink); }
.hstat span{ font-size:0.8125rem; text-transform:none; letter-spacing:0.02em; color:var(--ink-3); font-weight:400; }
.hstat:hover b{ color:var(--accent); }
.hstat:hover span{ color:var(--ink-2); }
.hstat-sep{ color:var(--ink-4); font-size:0.8125rem; line-height:1; padding:0 6px; }

/* ---- Home 2-col layout (main + social wall aside) ---- */
.home-2col{
  display:flex;
  gap:32px;
  align-items:flex-start;
  margin-top:44px;
}
.home-2col-main{
  flex:1;
  min-width:0;
}
.home-2col-side{
  width:280px;
  flex-shrink:0;
  position:sticky;
  top:72px; /* sotto la topbar */
  max-height:calc(100vh - 90px);
  overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:var(--r-md);
  padding:16px 14px;
}
/* Post compatto nella home aside */
.home-sw-item{
  display:flex;
  gap:8px;
  align-items:flex-start;
  padding:9px 0;
  border-bottom:1px solid var(--rule);
  cursor:pointer;
}
.home-sw-item:last-child{ border-bottom:none; }
.home-sw-av{
  flex-shrink:0;
  width:26px; height:26px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-ui); font-size:0.75rem; font-weight:700;
  color:var(--paper);
}
/* Francobollo immagine (se disponibile da RSS) */
.home-sw-stamp{
  flex-shrink:0;
  width:46px; height:46px;
  border-radius:var(--r-sm);
  overflow:hidden;
  background:var(--paper-2);
}
.home-sw-stamp img{
  width:100%; height:100%; object-fit:cover; display:block;
}
/* Corpo testo accanto al francobollo */
.home-sw-body{ flex:1; min-width:0; }
.home-sw-fonte{
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:700;
  text-transform:uppercase; letter-spacing:.05em;
  margin-bottom:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.home-sw-title{
  font-family:var(--font-ui);
  font-size:1rem; font-weight:600;
  color:var(--ink);
  line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.home-sw-meta{
  font-family:var(--font-ui);
  font-size:0.875rem; color:var(--ink-3);
  margin-top:2px;
}
@media(max-width:1000px){
  .home-2col{ flex-direction:column; }
  .home-2col-side{ width:100%; position:static; max-height:none; }
}

/* ---- Bandi + News 2-col grid (home v4.18.20) ---- */
.home-bn-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 28px;
  margin-top:36px;
  align-items:start;
}
.home-bn-col .section-head{ margin-top:0; }
.home-bn-col .home-list-row{ padding:12px 0; }
.home-bn-col .home-list-row .hlr-title{ font-size:1.05rem; }
.home-bn-col .home-list-row .hlr-sub{ -webkit-line-clamp:2; font-size:0.92rem; }
@media(max-width:900px){
  .home-bn-grid{ grid-template-columns:1fr; gap:24px 0; }
}

/* v4.18.23 — TUTTI i box della parte principale della home incorniciati (sx + dx)
   Stessa sintassi di .home-lsw-sw / Social Wall */
.home-bn-col-right,
.home-bn-col-left,
.home-pv-col-right,
.home-pv-col-left,
.home-lsw-libri{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:var(--r-md);
  padding:16px 18px 18px;
}
.home-bn-col-right .section-head,
.home-bn-col-left .section-head,
.home-pv-col-right .section-head,
.home-pv-col-left .section-head,
.home-lsw-libri .section-head{ margin-top:0; }

[data-theme="dark"] #heroSinopiaImg{mix-blend-mode:screen;opacity:.45}

/* v4.20 — Hero headline responsive (flex hero mobile) */
@media(max-width:780px){
  .home-headline-frame{flex-direction:column;padding:20px 16px}
  .home-headline-frame h1{font-size:clamp(28px,7vw,48px) !important}
}

/* Badge tematica prominente: testo esteso (es. "02 · Inclusione") con colore ambito */
.hlr-amb-strong{
  font-family:var(--font-ui);
  font-size:0.72rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--paper);
  background:var(--amb, var(--ink-2));
  padding:3px 9px;
  border-radius:4px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  line-height:1.4;
}
.hlr-amb-strong .hlr-amb-num{
  font-weight:800;
  background:rgba(255,255,255,.22);
  padding:1px 5px;
  border-radius:3px;
  font-size:0.68rem;
}

/* ---- Podcast+Video 2-col grid ---- */
.home-pv-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 32px;
  margin-top:44px;
}
@media(max-width:680px){
  .home-pv-grid{ grid-template-columns:1fr; }
}
.home-pv-col .section-head{ margin-top:0; }

/* ---- Libri + Social Wall 2-col grid (sotto podcast/video) ---- */
.home-lsw-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 32px;
  margin-top:44px;
  align-items:start;
}
.home-lsw-libri .section-head,
.home-lsw-sw .section-head{ margin-top:0; }
.home-lsw-sw{
  background:var(--paper);
  border:1px solid var(--rule);
  border-radius:var(--r-md);
  padding:16px 18px 18px;
}
@media(max-width:680px){
  .home-lsw-grid{ grid-template-columns:1fr; }
}

/* ---- Ambiti chips compatti ---- */
.home-ambiti-chips{
  display:flex; flex-direction:column; gap:8px;
  margin-top:12px;
}
.hamb-chip{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px;
  border:1px solid var(--rule);
  border-radius:var(--r-sm);
  background:var(--paper-1);
  text-decoration:none;
  cursor:pointer;
  transition:background .15s;
}
.hamb-chip:hover{ background:var(--paper-2); }
.hamb-num{
  font-family:var(--font-ui); font-size:0.75rem; font-weight:700;
  color:var(--amb); letter-spacing:.06em; min-width:22px;
}
.hamb-name{
  flex:1;
  font-family:var(--font-display); font-size:1rem; font-weight:600;
  color:var(--ink-1); line-height:1.3;
}
.hamb-count{
  font-family:var(--font-ui); font-size:0.75rem; font-weight:600;
  color:var(--ink-3);
  background:var(--paper-2);
  padding:2px 7px; border-radius:20px;
  border:1px solid var(--rule);
  white-space:nowrap;
}

/* ---- Home misc ---- */
.home-list-empty{
  font-family:var(--font-ui); font-size:0.875rem; color:var(--ink-3);
  padding:12px 0; font-style:italic;
}

/* INT-1 pillola freschezza dati */
.hero-update-pill{
  display:inline-flex; align-items:center; gap:8px;
  margin-top:14px; padding:6px 14px;
  background:var(--surface-2); border:1px solid var(--rule);
  border-radius:20px;
  font-size:0.875rem; color:var(--ink-2); font-weight:600;
  font-family:var(--font-display); font-style:italic;
}

/* ==========================================================
   SPRINT N9 — PAGINA STATISTICHE
   ========================================================== */
.st-kpi-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:14px; margin-bottom:28px;
}
.st-kpi-card{
  background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-md); padding:18px 16px;
  display:flex; flex-direction:column; gap:4px;
}
.st-kpi-val{
  font-family:var(--font-display); font-size:2rem; font-weight:700;
  line-height:1; letter-spacing:-0.02em;
}
.st-kpi-label{
  font-family:var(--font-ui); font-size:0.75rem; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2);
}
.st-kpi-sub{
  font-family:var(--font-ui); font-size:0.75rem; color:var(--ink-3);
  margin-top:2px;
}
.st-section-title{
  font-family:var(--font-ui); font-size:0.75rem; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2);
  margin-bottom:12px; padding-bottom:6px;
  border-bottom:1px solid var(--rule);
}
.st-ambiti{ display:flex; flex-direction:column; gap:8px; }
.st-amb-row{
  display:grid; grid-template-columns:200px 1fr 40px;
  align-items:center; gap:10px;
}
@media(max-width:600px){
  .st-amb-row{ grid-template-columns:120px 1fr 36px; }
}
.st-amb-label{
  font-family:var(--font-ui); font-size:0.875rem; color:var(--ink-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.st-bar-wrap{
  background:var(--surface-2); border-radius:3px; height:8px; overflow:hidden;
}
.st-bar{
  height:100%; border-radius:3px; transition:width .4s ease;
}
.st-amb-cnt{
  font-family:var(--font-ui); font-size:0.875rem; font-weight:600;
  color:var(--ink-2); text-align:right;
}
.st-info-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
}
.st-info-card{
  background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-sm); padding:12px 14px;
  display:flex; flex-direction:column; gap:4px;
}
.st-info-card span{ font-family:var(--font-ui); font-size:0.75rem; color:var(--ink-3); }
.st-info-card b{ font-family:var(--font-display); font-size:1.4rem; color:var(--ink); }

/* ==========================================================
   SPRINT N6 — PAGINA RICERCA GLOBALE
   ========================================================== */
.sr-query-bar{
  display:flex; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--rule-strong);
  border-radius:var(--r-md); padding:10px 16px;
  margin-bottom:28px;
}
.sr-query-bar svg{ color:var(--ink-3); flex-shrink:0; }
.sr-query-bar input{
  flex:1; border:none; outline:none; background:transparent;
  font-family:var(--font-ui); font-size:1.0625rem; color:var(--ink);
}
.sr-query-bar button{
  background:var(--ink); color:var(--paper); border:none;
  padding:7px 16px; border-radius:var(--r-sm);
  font-family:var(--font-ui); font-size:0.875rem; font-weight:600;
  cursor:pointer; white-space:nowrap;
}
.sr-hint{
  font-family:var(--font-ui); font-size:0.9375rem; color:var(--ink-3);
  padding:24px 0;
}
.sr-group{ margin-bottom:32px; }
.sr-group-head{
  display:flex; align-items:center; gap:10px;
  border-bottom:2px solid var(--rule-strong);
  padding-bottom:8px; margin-bottom:16px;
}
.sr-group-label{
  font-family:var(--font-ui); font-size:0.75rem; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2);
}
.sr-group-count{
  font-family:var(--font-ui); font-size:0.75rem; font-weight:600;
  color:var(--paper); background:var(--ink-3);
  border-radius:10px; padding:1px 7px; line-height:1.6;
}
.sr-row{ margin-bottom:10px; }
.sr-badge{
  display:inline-block; font-family:var(--font-ui); font-size:0.75rem;
  font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  padding:2px 7px; border-radius:3px; margin-right:4px;
}
.sr-badge.bando{ background:var(--accent-soft,#EEF0FF); color:var(--accent,var(--amb-6,#1D4ED8)); }
.sr-badge.urgente{ background:oklch(0.96 0.02 25); color:var(--danger); }

/* ==========================================================
   SECTION HEADS — stile rivista
   ========================================================== */
/* v4.27.5 — Section heads: spacing asimmetrico (piu margine sopra, meno sotto) */
.section-head{
  display:flex; justify-content:space-between; align-items:flex-end;
  border-bottom:1px solid var(--rule-strong);
  padding-bottom:10px;
  margin-top:44px;
  margin-bottom:18px;
}
.section-head .left{display:flex;align-items:baseline;gap:14px}
.section-eyebrow,.eyebrow{
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3);
}
.section-title{
  font-family:var(--font-serif);
  font-size:1.75rem; font-weight:600;
  letter-spacing:-0.02em; line-height:1.15;
  color:var(--ink); margin:0;
  display:flex; align-items:center; gap:10px;
}
.section-title em{font-family:var(--font-serif);font-style:italic;font-weight:400}
.section-action{
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-2);
  display:flex; align-items:center; gap:6px;
}
.section-action:hover{color:var(--link)}
.section-action .num{
  font-family:var(--font-display);
  font-style:italic; font-size:1rem;
  text-transform:none; letter-spacing:0;
  color:var(--ink-3); font-weight:400;
}

/* ==========================================================
   BANDI URGENTI — griglia editoriale
   ========================================================== */
.urgent-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  margin-bottom:64px;
  border-bottom:1px solid var(--rule);
}
.bando-card{
  padding:22px 24px 22px 0;
  border-right:1px solid var(--rule);
  cursor:pointer;
  position:relative;
  transition:opacity .15s;
  display:flex; flex-direction:column;
  min-height:170px;
  background:transparent;
}
.bando-card::before{display:none} /* rimuovi barra laterale precedente */
.bando-card:nth-child(3n){border-right:none;padding-right:0}
.bando-card:not(:nth-child(3n)){padding-right:24px}
.bando-card:nth-child(n+2){padding-left:24px}
.bando-card:hover{opacity:.65}
.bando-card:hover{transform:none;box-shadow:none;border-color:var(--rule)}

.bando-meta{
  display:flex; align-items:center; gap:10px;
  font-size:0.75rem; color:var(--ink-3);
  margin-bottom:14px;
  font-weight:600; letter-spacing:.14em;
  text-transform:uppercase;
  font-family:var(--font-ui);
}
.bando-meta .tag{
  padding:2px 7px;
  border:1px solid var(--rule-strong);
  border-radius:2px;
  font-size:0.75rem;
  letter-spacing:.12em;
}
.bando-meta .tag.urgent{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bando-meta .tag.med{background:transparent;color:var(--ink)}
.bando-meta .tag.low{background:transparent;color:var(--ink-3)}
.bando-meta .ente{
  font-weight:400;letter-spacing:.04em;text-transform:none;
  font-family:var(--font-ui);font-size:0.875rem;
}

.bando-title{
  font-family:var(--font-serif);
  font-size:1.5rem; font-weight:600;
  line-height:1.18; letter-spacing:-0.015em;
  color:var(--ink); margin:0 0 auto 0;
  text-wrap:pretty;
}
.bando-footer{
  display:flex; justify-content:space-between; align-items:center;
  font-size:0.875rem; color:var(--ink-3);
  margin-top:14px; padding-top:12px;
  border-top:1px solid var(--rule);
  font-family:var(--font-ui);
  border-bottom:none;
}
.bando-footer .days{
  font-style:normal;
  font-family:var(--font-ui);
  font-weight:600;
  color:var(--danger);
  font-variant-numeric:tabular-nums;
  letter-spacing:.04em;
}
.bando-card.prio-med .days,.bando-card.med .days{color:var(--warning)}
.bando-card.prio-low .days{color:var(--ink-3)}

/* Stato vuoto / skeleton */
.empty-state{
  padding:36px 20px;
  text-align:center;
  color:var(--ink-3);
  font-family:var(--font-serif);
  font-style:italic;
  font-size:1.0625rem;
}

/* v4.18.68 — Skeleton loader system */
.skeleton{
  background:linear-gradient(90deg,var(--rule) 25%,var(--rule-2) 50%,var(--rule) 75%);
  background-size:200% 100%;
  animation:skeleton-loading 1.4s ease-in-out infinite;
  border-radius:var(--r-sm);
}
@keyframes skeleton-loading{0%{background-position:200% 0}100%{background-position:-200% 0}}

.skeleton-card{
  min-height:160px;
  border-radius:var(--r-sm);
  margin-bottom:12px;
}
.skeleton-text-line{
  height:14px;
  border-radius:4px;
  margin-bottom:10px;
}
.skeleton-text-line.short{width:40%}
.skeleton-text-line.medium{width:65%}
.skeleton-text-line.long{width:90%}
.skeleton-row{
  height:56px;
  border-radius:var(--r-md);
  margin-bottom:8px;
}
.skeleton-title{
  height:22px;
  width:50%;
  border-radius:4px;
  margin-bottom:16px;
}
/* Nasconde skeleton quando i dati arrivano */
.skeleton-wrap[data-loaded="true"]{display:none}

/* ==========================================================
   AMBITI — sezione editoriale lista
   ========================================================== */
.ambiti-list,.ambiti-grid{margin-bottom:64px}

/* Lista editoriale (nuovo stile mockup) */
.ambito-row{
  display:grid;
  grid-template-columns:90px 1fr 280px;
  gap:32px;
  padding:28px 0;
  border-bottom:1px solid var(--rule);
  align-items:start;
  cursor:pointer;
  transition:background .15s;
  border-radius:0;
}
.ambito-row:hover{background:var(--surface-2)}
.ambito-row:hover .ambito-medallion{transform:scale(1.04)}
.ambito-row:last-child{border-bottom:none}

.ambito-medallion{
  width:74px; height:74px;
  border-radius:50%;
  background:var(--amb-soft,var(--surface-2));
  border:1px solid var(--amb,var(--ink-3));
  display:grid; place-items:center;
  color:var(--amb,var(--ink));
  font-family:var(--font-display);
  font-style:italic;
  font-size:1.8rem; font-weight:600;
  letter-spacing:-0.01em;
  flex:0 0 74px;
  margin-left:6px;
  transition:transform .25s ease;
  font-variant-numeric:tabular-nums;
}

.ambito-body .num,.ambito-num{
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--amb,var(--ink-3));
  margin-bottom:6px;
}
.ambito-body .name,.ambito-name{
  font-family:var(--font-display);
  font-size:1.8rem; font-weight:600;
  letter-spacing:-0.018em; line-height:1.1;
  color:var(--ink);
  margin:0 0 8px 0;
}
.ambito-body .desc,.ambito-desc{
  font-family:var(--font-display);
  font-size:1.125rem;
  line-height:1.5;
  color:var(--ink-2);
  margin:0 0 12px 0;
  max-width:56ch;
}
.ambito-body .dimensions{
  display:flex; gap:14px; flex-wrap:wrap;
  font-family:var(--font-display);
  font-style:italic;
  font-size:1rem;
  color:var(--ink-3);
}
.ambito-body .dimensions span::before{
  content:''; display:inline-block;
  width:3px; height:3px; border-radius:50%;
  background:var(--amb,var(--ink-3));
  margin-right:7px; vertical-align:middle;
  margin-bottom:2px;
}

.ambito-counts,.ambito-counters{
  display:flex; justify-content:flex-end;
  gap:24px;
  padding-top:6px;
}
.ambito-counts .c,.ambito-counters .c{
  display:flex; flex-direction:column; align-items:flex-end;
  gap:2px;
}
.ambito-counts .c b,.ambito-counters .c strong{
  font-family:var(--font-display);
  font-size:1.8rem; font-weight:600;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.02em;
  line-height:1;
  display:block;
}
.ambito-counts .c span,.ambito-counters .c span{
  font-size:0.75rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3);
}
.ambito-counts .c.new b,.ambito-counters .new{color:var(--amb,var(--link))}

/* Card ambito (legacy) */
.ambito-card{
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:var(--r-md);
  padding:20px 20px 18px 22px;
  cursor:pointer;
  transition:opacity .15s;
}
.ambito-card:hover{opacity:.8}

/* Ambiti row color mapping */
.ambito-row.a1,.ambito-card.a1{--amb:var(--amb-1);--amb-soft:var(--amb-1-soft)}
.ambito-row.a2,.ambito-card.a2{--amb:var(--amb-2);--amb-soft:var(--amb-2-soft)}
.ambito-row.a3,.ambito-card.a3{--amb:var(--amb-3);--amb-soft:var(--amb-3-soft)}
.ambito-row.a4,.ambito-card.a4{--amb:var(--amb-4);--amb-soft:var(--amb-4-soft)}
.ambito-row.a5,.ambito-card.a5{--amb:var(--amb-5);--amb-soft:var(--amb-5-soft)}

/* ==========================================================
   NEWS + FEED (home)
   ========================================================== */
.split{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:48px;
  margin-bottom:64px;
}
.news-list{display:flex;flex-direction:column;background:transparent;border:none}
.news-row{
  display:grid;
  grid-template-columns:46px 1fr auto;
  gap:20px;
  padding:22px 0;
  border-bottom:1px solid var(--rule);
  cursor:pointer;
  transition:opacity .15s;
  align-items:flex-start;
  background:transparent;
}
.news-row:hover{background:transparent;opacity:.7}
.news-row:first-child{padding-top:0}
.news-row:last-child{border-bottom:none}
.news-num{
  font-family:var(--font-display);
  font-size:2.4rem; font-weight:400;
  font-variant-numeric:tabular-nums;
  color:var(--ink-4);
  line-height:1; padding-top:2px;
  letter-spacing:-0.02em;
}
.news-body{min-width:0}
.news-tags{
  display:flex; gap:14px; align-items:center;
  margin-bottom:6px;
  font-size:0.75rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3);
  font-family:var(--font-ui);
  flex-wrap:wrap;
}
.news-tags .ambito-tag,.news-tag{
  display:flex; align-items:center; gap:6px;
  background:none; padding:0;
  border-radius:0; color:var(--ink-3); font-size:0.75rem;
}
.news-tags .ambito-tag::before{
  content:''; width:5px; height:5px; border-radius:50%;
  background:var(--tag-color,var(--ink-3));
}
.news-title{
  font-family:var(--font-display);
  font-size:1.5rem; font-weight:600;
  letter-spacing:-0.015em; line-height:1.22;
  color:var(--ink); margin:0 0 6px 0;
  text-wrap:pretty;
}
.news-meta{
  font-size:0.875rem; color:var(--ink-3);
  font-family:var(--font-display);
  font-style:italic;
}
.news-meta b{
  color:var(--ink-2); font-weight:600;
  font-style:normal;
  font-family:var(--font-ui);
  font-size:0.875rem;
}
.news-score{
  font-size:0.75rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3);
  border:1px solid var(--rule);
  padding:5px 8px;
  border-radius:2px;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  background:transparent;
}

/* ==========================================================
   SIDE PANEL — podcast / stats
   ========================================================== */
.side-panel{margin-bottom:36px;background:transparent;border:none;padding:0}
.side-panel h3{
  font-family:var(--font-display);
  font-size:1.25rem; font-weight:600;
  letter-spacing:-0.01em;
  margin:0 0 12px 0;
  padding-bottom:8px;
  border-bottom:1px solid var(--rule-strong);
}
.side-panel-head{
  border-bottom:1px solid var(--rule-strong);
  padding-bottom:8px; margin-bottom:14px;
  display:flex; justify-content:space-between; align-items:baseline;
}
.side-panel-head h3{border-bottom:none;margin:0;padding:0}
.side-panel-head .more{
  font-size:0.75rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3);
}

.pod-item{
  display:grid; grid-template-columns:32px 1fr auto;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--rule);
  cursor:pointer;
  align-items:center;
  transition:opacity .15s;
}
.pod-item:last-child{border-bottom:none}
.pod-item:hover{opacity:.7}
.pod-num{
  font-family:var(--font-display);
  font-size:1.8rem; font-weight:400;
  color:var(--ink-3);
  letter-spacing:-0.02em;
  line-height:1;
  padding-top:2px;
}
.pod-cover{
  width:42px; height:42px;
  border:1px solid var(--ink);
  border-radius:50%;
  display:grid; place-items:center;
  color:var(--ink);
  flex:0 0 42px;
  background:var(--paper);
}
.pod-body{min-width:0}
.pod-tags,.pod-tags{
  display:flex; gap:10px; align-items:center;
  margin-bottom:5px;
  font-size:0.75rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3);
  font-family:var(--font-ui);
}
.pod-title{
  font-family:var(--font-display);
  font-size:1.125rem; font-weight:600;
  line-height:1.3;
  margin:0 0 2px 0;
  text-wrap:pretty;
}
.pod-meta{
  font-size:0.875rem;
  color:var(--ink-3);
  font-family:var(--font-display);
  font-style:italic;
  margin-top:3px;
}
.pod-meta b{
  color:var(--ink-2); font-weight:600;
  font-style:normal;
  font-family:var(--font-ui);
  letter-spacing:.04em;
  font-size:0.75rem;
}
.pod-duration{
  font-size:0.75rem; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3);
  white-space:nowrap;
  padding-top:4px;
}

/* Stat grid */
.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0;
  border-top:1px solid var(--rule);
}
.stat{
  padding:18px 16px;
  border-right:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
  background:transparent;
  border-radius:0;
}
.stat:nth-child(2n){border-right:none}
.stat:nth-child(n+3){border-bottom:none}
.stat b{
  font-family:var(--font-display);
  font-size:2rem; font-weight:600;
  display:block; color:var(--ink); line-height:1;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.02em;
  margin-bottom:6px;
}
.stat span{
  font-size:0.75rem; font-weight:600;
  color:var(--ink-3);
  text-transform:uppercase; letter-spacing:.14em;
}

/* Scanner stat: singola riga orizzontale */
.stat-row{
  display:flex; align-items:center;
  border-top:1px solid var(--rule);
  padding:10px 0;
}
.stat-cell{
  flex:1; text-align:center; padding:8px 6px;
}
.stat-cell b{
  font-family:var(--font-display);
  font-size:1.6rem; font-weight:600;
  display:block; color:var(--ink); line-height:1;
  letter-spacing:-0.02em; margin-bottom:4px;
}
.stat-cell span{
  font-size:0.75rem; font-weight:600;
  color:var(--ink-3); text-transform:uppercase; letter-spacing:.12em;
}
.stat-sep{
  width:1px; height:36px; background:var(--rule); flex:none;
}

/* === ACCORDION AMBITI SIDEBAR === */
.nav-accordion-toggle {
  width: 100%;
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; cursor: pointer; padding: 0;
  /* default: uppercase label-style — override per nav-item toggle sotto */
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); text-align: left;
}
.nav-accordion-toggle:hover { color: var(--ink); }
.accordion-chevron {
  margin-left: auto; flex-shrink: 0;
  transition: transform .22s ease;
  color: var(--ink-3);
}
.nav-accordion-toggle[aria-expanded="false"] .accordion-chevron {
  transform: rotate(-90deg);
}
.accordion-body {
  overflow: hidden;
  max-height: 600px;
  transition: max-height 0.28s ease-out, opacity 0.2s ease-out;
}
.accordion-body.collapsed, [aria-expanded="false"] + .accordion-body {
  max-height: 0;
  opacity: 0;
}
.app-footer a { transition: color .15s ease; }
.app-footer a:hover { color: var(--accent, #935851); }

/* === CARD: font e leggibilità migliorata === */
.bando-row-title {
  font-family: var(--font-display);
  font-size: 1.25rem !important;
  font-weight: 600 !important;
  color: var(--ink) !important;
  line-height: 1.35;
}
.bando-row-summary {
  font-size: 1rem !important;
  color: var(--ink-2) !important;
  line-height: 1.55;
}
.bando-row-meta {
  font-size: 0.9375rem !important;
  color: var(--ink-2) !important;
  font-weight: 500;
}

/* Section divider tra gruppi urgenti / normali */
.section-divider{
  margin:18px 0 10px;
  border-top:1px solid var(--rule);
  padding-top:10px;
}
.section-divider span{
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3);
}
.section-divider.urgent-divider span{ color:var(--danger); }

/* ---- News card (.nr-row) ------------------------------------------- */
.nr-row{ }
.nr-row.nr-recente{ background: rgba(60,106,149,.04); }

/* Fonte badge — identità della testata */
.nr-fonte{
  display:inline-block;
  background:var(--paper-2);
  color:var(--ink-2);
  font-family:var(--font-ui);
  font-size:0.875rem; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
  padding:2px 7px; border-radius:3px;
  border:1px solid var(--rule);
  margin-right:4px;
}

/* Data nel meta sinistro */
.nr-data{
  font-family:var(--font-ui);
  font-size:0.8125rem;
  color:var(--ink-3);
}

/* Data nel pannello destro */
.nr-data-right{
  font-family:var(--font-ui);
  font-size:0.8125rem; font-weight:500;
  color:var(--ink-3);
  margin-left:auto;
}
/* Estratto / descrizione normativa */
.br-estratto{
  font-family:var(--font-ui);
  font-size:0.8125rem; color:var(--ink-3);
  line-height:1.5; margin:2px 0 0;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* Score AI */
.nr-score{
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:700;
  color:var(--ink-3);
  padding:1px 5px; border-radius:3px;
  background:var(--paper-2);
}
.nr-score.high{ background:oklch(0.96 0.03 165); color:var(--success); }
.nr-score.med { background:oklch(0.97 0.03 90); color:var(--amb-8,#B45309); }

/* ---- Social Wall — avatar circolare -------------------------------- */
.sw-avatar{
  flex-shrink:0;
  width:32px; height:32px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-ui);
  font-size:1rem; font-weight:700;
  color:var(--paper);
  letter-spacing:0;
}

/* ---- Social Wall — tessere (sw-tile) ------------------------------- */
.sw-section { margin-bottom: 36px; }

.sw-section-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px;
}
.sw-section-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.sw-section-label {
  font-family: var(--font-ui); font-size: 0.875rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2);
}
.sw-section-count {
  font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 600;
  background: var(--paper-2); color: var(--ink-3);
  padding: 1px 7px; border-radius: 10px;
  margin-left: 4px;
}

.sw-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}

/* Scheletro loading */
.sw-skeleton-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}
.sw-skeleton-tile { height: 150px; }

/* v4.27.13 — Social tile: bordo uniforme, no top-stripe pesante */
.sw-tile {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: 16px;
  display: flex; flex-direction: column; gap: 8px;
  cursor: pointer;
  transition: box-shadow .15s, transform .15s;
  text-decoration: none;
}
.sw-tile:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }

.sw-tile-head {
  display: flex; align-items: center; gap: 7px;
  flex-wrap: wrap;
}
.sw-tile-fonte {
  font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 700;
  color: var(--ink-2); flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: .02em;
}
.sw-tile-cat {
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-3); background: var(--paper-2);
  padding: 1px 5px; border-radius: 3px;
}

.sw-tile-title {
  font-family: var(--font-serif); font-size: 1rem; font-weight: 600;
  color: var(--ink); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; text-decoration: none;
}
.sw-tile-title:hover { color: var(--sw-col, var(--ink)); }

.sw-tile-excerpt {
  font-family: var(--font-ui); font-size: 0.875rem; color: var(--ink-2);
  line-height: 1.55; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; flex: 1;
}

.sw-tile-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: auto; padding-top: 8px;
  border-top: 1px solid var(--rule);
}
.sw-tile-date {
  font-family: var(--font-ui); font-size: 0.8125rem; color: var(--ink-3);
}
.sw-tile-link {
  font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 600;
  color: var(--sw-col, var(--ink-2)); letter-spacing: .01em;
}

/* Dark mode */
[data-theme="dark"] .sw-tile { background: var(--surface); }
[data-theme="dark"] .sw-tile:hover { box-shadow: 0 4px 20px rgba(0,0,0,.4); }

/* Estratto post (legacy lista) */
.sw-excerpt{
  font-family:var(--font-ui);
  font-size:0.875rem; color:var(--ink-2); line-height:1.55;
  margin:3px 0 0;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
}

/* ---- Podcast card (.pd-row) ---------------------------------------- */
.pd-row{ }
.pd-row.pd-recente{ background: rgba(156,106,54,.04); }

/* Show/serie badge */
.pd-show{
  display:inline-block;
  background:oklch(0.96 0.03 70);
  color:var(--amb-8,#B45309);
  font-family:var(--font-ui);
  font-size:0.875rem; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
  padding:2px 7px; border-radius:3px;
  border:1px solid oklch(0.85 0.10 80);
  margin-right:4px;
}

/* ---- Libro card (.lb-row) ----------------------------------------- */
.lb-row{ }
.lb-row.lb-recente{ background: rgba(107,92,154,.04); }

/* Editore badge */
.lb-editore{
  display:inline-block;
  background:oklch(0.96 0.03 290);
  color:var(--amb-1);
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
  padding:2px 7px; border-radius:3px;
  border:1px solid oklch(0.80 0.08 290);
  margin-right:4px;
}

/* Autore — sotto il titolo */
.lb-autore{
  font-family:var(--font-ui);
  font-size:0.875rem; font-weight:600;
  color:var(--ink-2);
  margin: -2px 0 6px;
  font-style:italic;
}

/* Anno nel pannello destro */
.lb-anno{
  font-family:var(--font-display);
  font-size:1.6rem; font-weight:700;
  color:var(--ink-3);
  text-align:center;
  margin-bottom:8px;
  letter-spacing:.04em;
}

/* Right column for libro (no min-height needed for anno) */
.lb-right{ min-width:120px; }

/* Add-libro form */
.lb-add-form{
  background:var(--paper-2);
  border:1px solid var(--rule);
  border-radius:8px;
  padding:16px 20px;
  margin-bottom:20px;
}
.lb-add-title{
  font-family:var(--font-ui);
  font-size:1rem; font-weight:700;
  color:var(--ink-1);
  margin:0 0 12px;
}
.lb-add-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto auto;
  gap:8px;
  margin-bottom:10px;
}
.lb-input{
  font-family:var(--font-ui);
  font-size:1rem;
  border:1px solid var(--rule);
  border-radius:5px;
  padding:6px 10px;
  background:var(--paper-1);
  color:var(--ink-1);
}
.lb-add-btn{
  font-family:var(--font-ui);
  font-size:1rem; font-weight:700;
  background:var(--amb-1);
  color:var(--paper);
  border:none; border-radius:5px;
  padding:8px 18px; cursor:pointer;
}
.lb-add-btn:hover{ opacity:.88; }
.lb-setup-btn{
  font-family:var(--font-ui);
  font-size:0.875rem; font-weight:600;
  background:var(--paper-2);
  color:var(--ink-2);
  border:1px solid var(--rule);
  border-radius:5px; padding:5px 12px; cursor:pointer;
  margin-top:8px;
}

/* ---- Video card (.vd-row) ----------------------------------------- */
.vd-row{ }
.vd-row.vd-recente{ background: rgba(200,16,46,.04); }

/* Canale YouTube badge */
.vd-canale{
  display:inline-block;
  background:oklch(0.96 0.02 25);
  color:var(--danger);
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
  padding:2px 7px; border-radius:3px;
  border:1px solid oklch(0.88 0.04 25);
  margin-right:4px;
}

/* Badge "Recente" */
.recente-badge{
  background:oklch(0.96 0.03 165) !important;
  color:var(--success) !important;
  font-weight:700 !important;
}

/* Bando-row urgente: bordo sinistra rosso */
.bando-row.bando-urgent{
  background:rgba(200,16,46,.04);
}
.bando-row.bando-urgent .bando-row-title{ color:var(--ink); }

/* Ambiti color tag mapping (data-amb) */
[data-amb="1"]{--tag-color:var(--amb-1)}
[data-amb="2"]{--tag-color:var(--amb-2)}
[data-amb="3"]{--tag-color:var(--amb-3)}
[data-amb="4"]{--tag-color:var(--amb-4)}
[data-amb="5"]{--tag-color:var(--amb-5)}

/* Colophon */
.colophon{
  border-top:1px solid var(--rule-strong);
  padding-top:18px;
  margin-top:32px;
  display:flex; justify-content:space-between;
  font-family:var(--font-display);
  font-style:italic;
  font-size:0.875rem;
  color:var(--ink-3);
}

/* ==========================================================
   PAGE: BANDI
   ========================================================== */
/* v4.27.13 — Page head: tipografia coerente con DESIGN.md */
.page-head{
  margin-bottom:32px;
  padding:28px 32px;
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:var(--r-md);
  display:block;
}
.page-eyebrow,.eyebrow{
  font-family:var(--font-ui);
  font-size:0.6875rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--accent);
  margin-bottom:10px;
}
.page-title{
  font-family:var(--font-serif);
  font-size:2.5rem; font-weight:600;
  letter-spacing:-0.025em; line-height:1.1;
  color:var(--ink);
  margin:0 0 10px 0;
}
.page-title em{font-family:var(--font-serif);font-style:italic;font-weight:400}
.page-sub,.page-deck{
  font-family:var(--font-ui);
  font-size:0.9375rem; line-height:1.55;
  color:var(--ink-3);
  max-width:64ch;
  margin:0;
}

.filters{
  display:flex; gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
  padding-bottom:18px;
  border-bottom:1px solid var(--rule);
  background:transparent;
  border-radius:0;
  border-top:none; border-left:none; border-right:none;
  padding-top:0;
}
.filter-chip{
  font-family:var(--font-ui);
  font-size:0.875rem; font-weight:600;
  padding:7px 14px; min-height:44px;
  border:1px solid var(--rule);
  border-radius:100px;
  background:transparent;
  color:var(--ink-2);
  transition:all .15s;
  letter-spacing:.01em;
}
.filter-chip:hover{border-color:var(--rule-2);color:var(--ink)}
.filter-chip.active{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.filter-chip .count{
  font-family:var(--font-display);
  font-style:italic;
  margin-left:6px;
  color:var(--ink-3);
  font-size:0.75rem;
}
.filter-chip.active .count{color:rgba(255,255,255,.7)}

/* Tabella bandi */
.table-card,.bandi-table{margin-top:0}
.table-head{display:none} /* sostituito da table-row stile editoriale */
.table-row{
  display:grid;
  grid-template-columns:60px 3fr 1.4fr 1fr 110px;
  gap:18px;
  padding:22px 8px;
  border-bottom:1px solid var(--rule);
  cursor:pointer;
  align-items:start;
  transition:background .15s;
  background:transparent;
}
.table-row:hover{background:var(--surface-2)}
.table-row .t-num,.table-row .t-title small:first-child ~ *{display:none}
.t-num{
  font-family:var(--font-display);
  font-size:1.8rem; font-weight:400;
  font-variant-numeric:tabular-nums;
  color:var(--ink-4);
  line-height:1; padding-top:2px;
  letter-spacing:-0.02em;
}
.table-row .t-title{
  font-family:var(--font-display);
  font-size:1.25rem; font-weight:600;
  line-height:1.25; letter-spacing:-0.012em;
  color:var(--ink);
  text-wrap:pretty;
}
.table-row .t-title small{
  display:block;
  font-family:var(--font-display);
  font-style:italic;
  font-weight:400;
  font-size:1rem;
  color:var(--ink-3);
  margin-top:4px;
  letter-spacing:0;
}
.table-row .t-ente{
  font-size:1rem;
  color:var(--ink-2);
  font-family:var(--font-display);
}
.table-row .t-ambito,.t-ambito{
  display:flex; align-items:center; gap:6px;
  font-size:0.75rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3);
  margin-top:4px;
  font-family:var(--font-ui);
}
.table-row .t-import{
  font-family:var(--font-display);
  font-size:1.125rem; font-weight:600;
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.01em;
}
.table-row .t-scadenza,.t-days{
  text-align:right;
  font-family:var(--font-display);
  font-size:1.8rem; font-weight:600;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  letter-spacing:-0.02em;
  line-height:1;
}
.table-row .t-scadenza b{color:var(--danger);font-weight:600}
.table-row.urgent .t-days,.table-row.urgent .t-scadenza b{color:var(--danger)}
.table-row.med .t-days,.table-row.med .t-scadenza b{color:var(--warning)}

/* ==========================================================
   AMBITO HERO (pagina ambito singolo)
   ========================================================== */
.ambito-hero{
  padding:36px 36px 42px 36px;
  margin-bottom:36px;
  display:grid;
  grid-template-columns:1fr 220px;
  gap:48px;
  align-items:start;
  background:var(--amb-soft, var(--surface-2));
  border-radius:var(--r-md);
  color:var(--ink);
}
.ambito-hero .hero-num,.ambito-hero .eyebrow{
  font-family:var(--font-ui);
  font-size:0.75rem; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase;
  color:var(--amb,var(--link));
  margin-bottom:16px;
  display:flex; align-items:center; gap:10px;
}
.ambito-hero .hero-num::before{
  content:''; width:8px; height:8px; border-radius:50%;
  background:var(--amb,var(--link));
}
.ambito-hero h1{
  font-family:var(--font-display);
  font-size:5rem; font-weight:600;
  line-height:.96; letter-spacing:-0.035em;
  margin:0 0 18px 0;
  color:var(--ink);
  max-width:14ch;
}
.ambito-hero h1 em{font-family:var(--font-italic);font-weight:400;color:var(--ink)}
.ambito-hero .lede,.ambito-hero p{
  font-family:var(--font-display);
  font-size:1.25rem; line-height:1.5;
  color:var(--ink-2);
  margin:0 0 24px 0;
  max-width:60ch;
  opacity:1;
}
.ambito-hero .kpi{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.ambito-hero .kpi>div{display:flex;align-items:baseline;gap:10px}
.ambito-hero .kpi b{
  font-family:var(--font-display); font-weight:600;
  font-size:1.5rem; line-height:1;
  color:var(--amb,var(--link));
  min-width:2.4ch; text-align:right;
}
.ambito-hero .kpi span{
  font-size:0.72rem; color:var(--ink-3);
  text-transform:uppercase; letter-spacing:.1em;
}

.ambito-page.a1,.ambito-hero.a1,.a1{--amb:var(--amb-1);--amb-soft:var(--amb-1-soft)}
.ambito-page.a2,.ambito-hero.a2,.a2{--amb:var(--amb-2);--amb-soft:var(--amb-2-soft)}
.ambito-page.a3,.ambito-hero.a3,.a3{--amb:var(--amb-3);--amb-soft:var(--amb-3-soft)}
.ambito-page.a4,.ambito-hero.a4,.a4{--amb:var(--amb-4);--amb-soft:var(--amb-4-soft)}
.ambito-page.a5,.ambito-hero.a5,.a5{--amb:var(--amb-5);--amb-soft:var(--amb-5-soft)}

/* Dimensioni card (sidebar ambito) */
.dimensions-card{border-left:1px solid var(--rule);padding-left:24px}
.dimensions-card .label{
  font-size:0.75rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3);
  margin-bottom:12px;
  font-family:var(--font-ui);
}
.dim-item{padding:14px 0;border-bottom:1px solid var(--rule)}
.dim-item:last-child{border-bottom:none}
.dim-item .dim-num{
  font-family:var(--font-display);font-style:italic;
  font-size:1rem;color:var(--amb,var(--link));font-weight:600;
}
.dim-item .dim-name{
  font-family:var(--font-display);
  font-size:1.125rem; font-weight:600;
  letter-spacing:-0.01em;
  margin:2px 0 4px 0;
}
.dim-item .dim-meta{
  font-size:0.75rem;color:var(--ink-3);
  font-family:var(--font-display);font-style:italic;
}

/* KPI ambito */
.ambito-kpi{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:0;margin-bottom:64px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
}
.ambito-kpi .k{padding:22px 24px 22px 0;border-right:1px solid var(--rule)}
.ambito-kpi .k:last-child{border-right:none}
.ambito-kpi .k:not(:first-child){padding-left:24px}
.ambito-kpi .k b{
  font-family:var(--font-display);font-size:3rem;font-weight:600;
  display:block;line-height:1;letter-spacing:-0.03em;
  color:var(--ink);margin-bottom:6px;font-variant-numeric:tabular-nums;
}
.ambito-kpi .k.accent b{color:var(--amb,var(--link))}
.ambito-kpi .k span{
  font-size:0.75rem;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  font-family:var(--font-ui);
}

/* ==========================================================
   METRICS STRIP
   ========================================================== */
.metrics-strip{
  padding:10px 0; margin-bottom:20px;
  font-size:0.75rem; color:var(--ink-3);
  font-family:var(--font-display);
  font-style:italic;
  display:flex; justify-content:space-between;
  flex-wrap:wrap; gap:8px;
  border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule);
}
.metrics-strip strong{color:var(--link);font-style:normal;font-weight:600}

/* ==========================================================
   TOPBAR — topbar-badge, topbar-hamburger
   ========================================================== */
.topbar-hamburger{
  display:none; align-items:center; justify-content:center;
  width:36px; height:36px;
  border-radius:var(--r-sm);
  color:var(--ink-2); background:none; border:none;
  cursor:pointer;
}
.topbar-hamburger:hover{background:var(--surface-2)}

/* ==========================================================
   RESPONSIVE
   ========================================================== */
@media (max-width:1100px){
  .split{grid-template-columns:1fr}
  .urgent-grid{grid-template-columns:1fr}
  .bando-card{border-right:none;border-bottom:1px solid var(--rule);padding:18px 0!important}
  .ambito-row{grid-template-columns:74px 1fr}
  .ambito-counts{grid-column:1/-1;justify-content:flex-start;border-top:1px solid var(--rule);padding-top:14px;margin-top:8px}
  .table-row{grid-template-columns:1fr;gap:4px}
  .t-num{display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed; z-index:50;
    transform:translateX(-100%); transition:transform .25s cubic-bezier(0.16, 1, 0.3, 1);
    width:var(--sidebar-w);
  }
  .sidebar.open{transform:translateX(0)}
  .topbar{padding:0 16px}
  .page{padding:24px 20px 60px 20px}
  .home-headline,.hero h1{font-size:2.2rem}
  .page-title{font-size:1.8rem}
  .ambito-hero h1{font-size:2rem}
  .ambito-hero{grid-template-columns:1fr}
  .ambito-kpi{grid-template-columns:repeat(2,1fr)}
  .topbar-hamburger,.menu-btn{display:flex}
  /* br-row: singola colonna, bottoni azione allineati dx */
  .br-row { grid-template-columns: 1fr; }
  .br-right { flex-direction: row; align-items: center; justify-content: flex-end; text-align: right; flex-wrap: wrap; gap: 8px; }
  .br-acts { justify-content: flex-end; margin-left: auto; }
  .home-pv-grid { grid-template-columns: 1fr; }
  .st-kpi-grid { grid-template-columns: repeat(2,1fr); }
  .st-info-grid { grid-template-columns: 1fr; }
  /* v4.27.6 — Sidebar overlay: backdrop scuro */
  .sidebar-backdrop { display: block; position: fixed; inset: 0; z-index: 49; background: oklch(0.14 0.005 70 / 0.4); opacity: 0; transition: opacity .25s; pointer-events: none; }
  .sidebar.open ~ .sidebar-backdrop, .sidebar-backdrop.visible { opacity: 1; pointer-events: auto; }
}
/* v4.23.1 — su telefono nascondi la ricerca in topbar (cramped): in Home c'è la hero search */
@media (max-width:640px){
  .topbar-search{display:none}
}

/* ============================================================
   v4.27.6 — RESPONSIVE MOBILE (< 480px)
   Telefoni piccoli: tipografia compatta, spacing ridotto,
   card bandi a colonna singola, stats inline wrapping.
   ============================================================ */
@media (max-width:480px){
  /* Page: padding stretto */
  .page { padding: 16px 14px 48px 14px; }

  /* Tipografia: scala ridotta */
  h1 { font-size: 1.75rem; }
  h2 { font-size: 1.375rem; }
  .section-title { font-size: 1.5rem; }
  .home-headline, .hero h1 { font-size: 1.75rem; max-width: none; }
  .home-deck, .hero p { font-size: 1.125rem; }

  /* Section head: meno margine sopra */
  .section-head { margin-top: 28px; margin-bottom: 14px; padding-bottom: 8px; }

  /* Topbar: compatta */
  .topbar { height: 52px; padding: 0 12px; gap: 8px; }
  .topbar-actions { gap: 2px; }
  .theme-toggle, .topbar-icon, .icon-btn { width: 32px; height: 32px; }
  .breadcrumb { font-size: 0.8125rem; }
  .breadcrumb b { font-size: 0.875rem; }
  .kbd { display: none; }

  /* Stats bar: wrap naturale */
  .home-stats-bar { padding: 8px 0; gap: 2px 0; }
  .hstat b { font-size: 0.75rem; }
  .hstat span { font-size: 0.75rem; }
  .hstat-sep { padding: 0 4px; font-size: 0.75rem; }

  /* Bandi row: compatto */
  .br-row { padding: 10px 0 8px; gap: 6px; }
  .br-title { font-size: 1rem; }
  .br-summary { font-size: 0.8125rem; -webkit-line-clamp: 2; }
  .br-meta { font-size: 0.75rem; }
  .br-tags { gap: 4px; margin-bottom: 3px; }
  .br-tema { font-size: 0.6875rem; padding: 2px 7px; letter-spacing: 0.08em; }
  .br-badge-urgent, .br-badge-new { font-size: 0.6875rem; padding: 2px 7px; }
  .br-tipo-badge { font-size: 0.625rem; padding: 2px 6px; }
  .br-scad { font-size: 0.875rem; }
  .br-giorni { font-size: 0.75rem; padding: 1px 6px; }
  .br-link { font-size: 0.8125rem; padding: 6px 10px; }
  .br-acts { gap: 4px; padding-top: 6px; }
  .br-act { font-size: 0.6875rem; padding: 4px 8px; min-height: 36px; }

  /* Masthead: colonna su mobile */
  .home-masthead { flex-direction: column; gap: 12px; margin-bottom: 24px; }

  /* Hero */
  .home-search, .hero-search { padding: 10px 0; gap: 10px; }
  .home-search input, .hero-search input { font-size: 1rem; }
  .home-chips, .hero-chips { margin-bottom: 32px; gap: 4px 10px; }

  /* Bando card grid (home urgenti) */
  .urgent-grid { grid-template-columns: 1fr; margin-bottom: 32px; }
  .bando-card { padding: 14px 0; min-height: auto; border-right: none; border-bottom: 1px solid var(--rule); }
  .bando-card:not(:nth-child(3n)) { padding-right: 0; }
  .bando-card:nth-child(n+2) { padding-left: 0; }
  .bando-title { font-size: 1.125rem; }

  /* Filter chips: scroll orizzontale */
  .filters { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; gap: 6px; }
  .filter-chip { flex-shrink: 0; font-size: 0.75rem; padding: 5px 12px; }

  /* Social wall tiles */
  .sw-tile { padding: 14px; }
  .sw-tile-title { font-size: 0.9375rem; }

  /* Ambiti chips */
  .hamb-chip { padding: 10px 12px; gap: 8px; }
  .hamb-name { font-size: 0.875rem; }

  /* Empty state */
  .empty-state { padding: 24px 14px; font-size: 0.9375rem; }

  /* Nav sidebar overlay: piu larga su mobile piccoli */
  .sidebar { width: 85vw; max-width: 320px; }
  .brand-mark svg { width: 130px; }
}

/* === BANDO ROW (pagina bandi + ambito, full-width con pulsanti) === */
#bandiList { margin-bottom: 64px; }
.bando-row {
  padding: 18px 0;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: opacity .15s;
}
.bando-row:hover { opacity: .75; }
.bando-row-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.bando-row-title { font-family: var(--font-serif); font-size: 1.125rem; font-weight: 600; color: var(--ink); margin: 4px 0; line-height: 1.3; }
.bando-row-summary { font-size: 0.9375rem; color: var(--ink-3); line-height: 1.5; margin: 6px 0; }
.bando-row-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 0.875rem; color: var(--ink-3); margin-top: 8px; }

/* === ITEM ACTIONS (v2 — ben visibili) === */
.item-actions {
  display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; align-items: center;
}
.act-btn {
  font-family: var(--font-ui); font-size: 0.9375rem; font-weight: 600;
  padding: 7px 14px; border-radius: 7px;
  border: 1.5px solid currentColor;
  background: var(--surface); color: var(--ink-2); cursor: pointer;
  transition: all .15s; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
  line-height: 1;
}
.act-btn:hover { filter: brightness(.93); }

/* v4.27.7 — Azioni legacy OKLCH */
.act-btn.act-archive {
  color: var(--warning);
  border-color: oklch(0.68 0.14 80);
  background: oklch(0.98 0.03 90);
}
.act-btn.act-archive:hover { background: oklch(0.96 0.04 80); }

.act-btn.act-trash {
  color: var(--danger);
  border-color: var(--danger);
  background: oklch(0.97 0.02 25);
}
.act-btn.act-trash:hover { background: oklch(0.94 0.04 25); }

.act-btn.act-read {
  color: var(--success);
  border-color: var(--success);
  background: oklch(0.97 0.03 165);
}
.act-btn.act-read:hover { background: oklch(0.94 0.04 165); }

/* === SCORE/PERTINENZA BADGE === */
.score-badge {
  font-family: var(--font-ui); font-size: 0.8125rem; font-weight: 600;
  padding: 2px 8px; border-radius: 20px;
  background: var(--surface-2, #F0EDE6); color: var(--ink-3);
  letter-spacing: .02em;
}
.score-badge.high { background: oklch(0.96 0.03 165); color: var(--success); }
